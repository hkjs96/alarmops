AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AlarmOps CloudTrail alert rules for the central deploy roles (deploy-role-policy.md 4-2, issue 115).
  Deploy this one template as stack alarmops-central-alerts in each of the two regions, by a human.
  Per region: the global IAM event region gets the IAM direct-call rule and the IAM denied rule; every other region gets the service direct-call rule, the service denied rule and the deploy rule (one mail per CloudFormation deployment).
  The deploy roles must not be able to change these resources (isolation test: infra/test/test_central_alerts.py).

Parameters:
  AlertEmail:
    Type: String
    Description: Security contact that receives the alerts. Confirm the subscription mail in every region.
    AllowedPattern: '^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}$'
    ConstraintDescription: Must be an email address.
  ResourcePrefix:
    Type: String
    Default: AlarmOpsGuard
    AllowedPattern: '^AlarmOpsGuard$'
    ConstraintDescription: Fixed. The deploy roles are denied or not granted changes on names with this prefix only.

Conditions:
  IsUsEast1: !Equals [!Ref "AWS::Region", us-east-1]
  IsNotUsEast1: !Not [!Condition IsUsEast1]

Resources:
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ResourcePrefix}-alerts"
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref AlertTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowGuardRulesPublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertTopic
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${ResourcePrefix}-*"

  IamChangeRule:
    Type: AWS::Events::Rule
    Condition: IsUsEast1
    Properties:
      Name: !Sub "${ResourcePrefix}-iam-change"
      Description: IAM role changes made by the central deploy role by a direct call (not through CloudFormation)
      State: ENABLED
      EventPattern:
        source:
          - aws.iam
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventName:
            - CreateRole
            - UpdateAssumeRolePolicy
            - PutRolePolicy
            - AttachRolePolicy
            - PutRolePermissionsBoundary
            - DeleteRolePermissionsBoundary
            - CreatePolicyVersion
            - SetDefaultPolicyVersion
          userIdentity:
            sessionContext:
              sessionIssuer:
                userName:
                  - AlarmOpsDeployCentral
          sourceIPAddress:
            - anything-but: cloudformation.amazonaws.com
      Targets:
        - Id: alert-topic
          Arn: !Ref AlertTopic
          InputTransformer:
            InputPathsMap:
              eventName: $.detail.eventName
              errorCode: $.detail.errorCode
              eventTime: $.detail.eventTime
              sourceIp: $.detail.sourceIPAddress
              userAgent: $.detail.userAgent
              region: $.detail.awsRegion
              eventId: $.detail.eventID
              actor: $.detail.userIdentity.sessionContext.sessionIssuer.userName
              roleName: $.detail.requestParameters.roleName
              policyArn: $.detail.requestParameters.policyArn
            InputTemplate: |-
              {
                "rule": "<aws.events.rule-name>",
                "eventName": "<eventName>",
                "errorCode (empty = succeeded)": "<errorCode>",
                "actor": "<actor>",
                "target": {"roleName": "<roleName>", "policyArn": "<policyArn>"},
                "eventTime": "<eventTime>",
                "sourceIPAddress": "<sourceIp>",
                "userAgent": "<userAgent>",
                "awsRegion": "<region>",
                "eventID (search it in CloudTrail)": "<eventId>"
              }

  IamDeniedRule:
    Type: AWS::Events::Rule
    Condition: IsUsEast1
    Properties:
      Name: !Sub "${ResourcePrefix}-iam-denied"
      Description: URGENT - IAM role change DENIED for the central deploy role (any path, including through CloudFormation)
      State: ENABLED
      EventPattern:
        source:
          - aws.iam
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventName:
            - CreateRole
            - UpdateAssumeRolePolicy
            - PutRolePolicy
            - AttachRolePolicy
            - PutRolePermissionsBoundary
            - DeleteRolePermissionsBoundary
            - CreatePolicyVersion
            - SetDefaultPolicyVersion
          userIdentity:
            sessionContext:
              sessionIssuer:
                userName:
                  - AlarmOpsDeployCentral
          errorCode:
            - exists: true
      Targets:
        - Id: alert-topic
          Arn: !Ref AlertTopic
          InputTransformer:
            InputPathsMap:
              eventName: $.detail.eventName
              errorCode: $.detail.errorCode
              eventTime: $.detail.eventTime
              sourceIp: $.detail.sourceIPAddress
              userAgent: $.detail.userAgent
              region: $.detail.awsRegion
              eventId: $.detail.eventID
              actor: $.detail.userIdentity.sessionContext.sessionIssuer.userName
              roleName: $.detail.requestParameters.roleName
              policyArn: $.detail.requestParameters.policyArn
            InputTemplate: |-
              {
                "severity": "URGENT - denied call by the deploy role",
                "rule": "<aws.events.rule-name>",
                "eventName": "<eventName>",
                "errorCode (empty = succeeded)": "<errorCode>",
                "actor": "<actor>",
                "target": {"roleName": "<roleName>", "policyArn": "<policyArn>"},
                "eventTime": "<eventTime>",
                "sourceIPAddress": "<sourceIp>",
                "userAgent": "<userAgent>",
                "awsRegion": "<region>",
                "eventID (search it in CloudTrail)": "<eventId>"
              }

  ServiceChangeRule:
    Type: AWS::Events::Rule
    Condition: IsNotUsEast1
    Properties:
      Name: !Sub "${ResourcePrefix}-service-change"
      Description: Queue, function and bus permission changes made by the central deploy roles by a direct call (not through CloudFormation)
      State: ENABLED
      EventPattern:
        source:
          - aws.sqs
          - aws.lambda
          - aws.events
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventName:
            - SetQueueAttributes
            - prefix: UpdateFunctionCode
            - prefix: UpdateFunctionConfiguration
            - prefix: AddPermission
            - PutPermission
            - prefix: CreateFunction
            - prefix: CreateEventSourceMapping
            - prefix: UpdateEventSourceMapping
            - PutRule
            - PutTargets
            - RemoveTargets
            - DeleteRule
          userIdentity:
            sessionContext:
              sessionIssuer:
                userName:
                  - AlarmOpsDeployCentral
                  - AlarmOpsDeployBus
          sourceIPAddress:
            - anything-but: cloudformation.amazonaws.com
      Targets:
        - Id: alert-topic
          Arn: !Ref AlertTopic
          InputTransformer:
            InputPathsMap:
              eventName: $.detail.eventName
              errorCode: $.detail.errorCode
              eventTime: $.detail.eventTime
              sourceIp: $.detail.sourceIPAddress
              userAgent: $.detail.userAgent
              region: $.detail.awsRegion
              eventId: $.detail.eventID
              actor: $.detail.userIdentity.sessionContext.sessionIssuer.userName
              functionName: $.detail.requestParameters.functionName
              name: $.detail.requestParameters.name
              ruleName: $.detail.requestParameters.rule
              queueUrl: $.detail.requestParameters.queueUrl
              mappingUuid: $.detail.requestParameters.uUID
            InputTemplate: |-
              {
                "rule": "<aws.events.rule-name>",
                "eventName": "<eventName>",
                "errorCode (empty = succeeded)": "<errorCode>",
                "actor": "<actor>",
                "target": {"functionName": "<functionName>", "name": "<name>", "rule": "<ruleName>", "queueUrl": "<queueUrl>", "eventSourceMappingUuid": "<mappingUuid>"},
                "eventTime": "<eventTime>",
                "sourceIPAddress": "<sourceIp>",
                "userAgent": "<userAgent>",
                "awsRegion": "<region>",
                "eventID (search it in CloudTrail)": "<eventId>"
              }

  ServiceDeniedRule:
    Type: AWS::Events::Rule
    Condition: IsNotUsEast1
    Properties:
      Name: !Sub "${ResourcePrefix}-service-denied"
      Description: URGENT - queue, function or bus change DENIED for the central deploy roles (any path, including through CloudFormation)
      State: ENABLED
      EventPattern:
        source:
          - aws.sqs
          - aws.lambda
          - aws.events
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventName:
            - SetQueueAttributes
            - prefix: UpdateFunctionCode
            - prefix: UpdateFunctionConfiguration
            - prefix: AddPermission
            - PutPermission
            - prefix: CreateFunction
            - prefix: CreateEventSourceMapping
            - prefix: UpdateEventSourceMapping
            - PutRule
            - PutTargets
            - RemoveTargets
            - DeleteRule
          userIdentity:
            sessionContext:
              sessionIssuer:
                userName:
                  - AlarmOpsDeployCentral
                  - AlarmOpsDeployBus
          errorCode:
            - exists: true
      Targets:
        - Id: alert-topic
          Arn: !Ref AlertTopic
          InputTransformer:
            InputPathsMap:
              eventName: $.detail.eventName
              errorCode: $.detail.errorCode
              eventTime: $.detail.eventTime
              sourceIp: $.detail.sourceIPAddress
              userAgent: $.detail.userAgent
              region: $.detail.awsRegion
              eventId: $.detail.eventID
              actor: $.detail.userIdentity.sessionContext.sessionIssuer.userName
              functionName: $.detail.requestParameters.functionName
              name: $.detail.requestParameters.name
              ruleName: $.detail.requestParameters.rule
              queueUrl: $.detail.requestParameters.queueUrl
              mappingUuid: $.detail.requestParameters.uUID
            InputTemplate: |-
              {
                "severity": "URGENT - denied call by the deploy role",
                "rule": "<aws.events.rule-name>",
                "eventName": "<eventName>",
                "errorCode (empty = succeeded)": "<errorCode>",
                "actor": "<actor>",
                "target": {"functionName": "<functionName>", "name": "<name>", "rule": "<ruleName>", "queueUrl": "<queueUrl>", "eventSourceMappingUuid": "<mappingUuid>"},
                "eventTime": "<eventTime>",
                "sourceIPAddress": "<sourceIp>",
                "userAgent": "<userAgent>",
                "awsRegion": "<region>",
                "eventID (search it in CloudTrail)": "<eventId>"
              }

  DeployRule:
    Type: AWS::Events::Rule
    Condition: IsNotUsEast1
    Properties:
      Name: !Sub "${ResourcePrefix}-deploy"
      Description: One mail per CloudFormation deployment started by the central deploy roles. Compare it with the CI run.
      State: ENABLED
      EventPattern:
        source:
          - aws.cloudformation
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventName:
            - ExecuteChangeSet
            - CreateStack
            - UpdateStack
            - DeleteStack
          userIdentity:
            sessionContext:
              sessionIssuer:
                userName:
                  - AlarmOpsDeployCentral
                  - AlarmOpsDeployBus
      Targets:
        - Id: alert-topic
          Arn: !Ref AlertTopic
          InputTransformer:
            InputPathsMap:
              eventName: $.detail.eventName
              errorCode: $.detail.errorCode
              eventTime: $.detail.eventTime
              sourceIp: $.detail.sourceIPAddress
              userAgent: $.detail.userAgent
              region: $.detail.awsRegion
              eventId: $.detail.eventID
              actor: $.detail.userIdentity.sessionContext.sessionIssuer.userName
              stackName: $.detail.requestParameters.stackName
              changeSetName: $.detail.requestParameters.changeSetName
            InputTemplate: |-
              {
                "rule": "<aws.events.rule-name>",
                "eventName": "<eventName>",
                "errorCode (empty = succeeded)": "<errorCode>",
                "actor": "<actor>",
                "target": {"stackName": "<stackName>", "changeSetName": "<changeSetName>"},
                "eventTime": "<eventTime>",
                "sourceIPAddress": "<sourceIp>",
                "userAgent": "<userAgent>",
                "awsRegion": "<region>",
                "eventID (search it in CloudTrail)": "<eventId>"
              }
