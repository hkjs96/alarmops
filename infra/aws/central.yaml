AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  AlarmOps central account bundle (hkjs96/alarmops#47, Seoul): ingest Lambdas (webhook, EventBridge, alert consumer),
  alert-events and alarm-commands queues (each with a DLQ, SSE), the alarm-engine Lambda, the central role that
  customer stacks trust, the Vercel OIDC role (D-49), the central-bus rule that delivers CloudTrail tag events to
  alarm-commands, and the DB connection secrets (values are put by a person). The event bus itself is
  central-bus.yaml (deployed first; its allow list is changed only by the bus-allowlist workflow).

# Expected build output (made by a later backend packaging step; nothing is built from this folder). Paths are
# relative to this template. A missing folder makes `sam deploy` fail, and deploy-central.yml checks them first.
#   ../../services/ingest/dist/webhook/index.mjs        exports `handler` (makeWebhookHandler wired to repo + SQS)
#   ../../services/ingest/dist/eventbridge/index.mjs    exports `handler` (makeEventBridgeHandler)
#   ../../services/ingest/dist/consumer/index.mjs       exports `handler` (makeConsumerHandler, alert-events)
#   ../../services/alarm-engine/build/                  alarm_engine/ package + its dependencies at the top level
#                                                       (handler alarm_engine.handler.lambda_handler)

Parameters:
  PermissionsBoundaryName:
    Type: String
    Default: AlarmOpsCentral-RoleBoundary
    AllowedPattern: '^[A-Za-z0-9+=,.@_-]{1,128}$'
    Description: >-
      Name of the IAM managed policy a person created in this account (infra/aws/deploy-role-policy.md). Every role
      this stack creates, including the Lambda execution roles SAM generates, gets it as its permissions boundary (D-58).
  ResourcePrefix:
    Type: String
    Default: alarmops
    AllowedPattern: '^[a-z][a-z0-9-]{1,20}$'
  CentralBusName:
    Type: String
    Default: alarmops-central
    AllowedPattern: '^[A-Za-z0-9._-]{1,64}$'
    Description: Name of the bus created by central-bus.yaml (stack output BusName). Must exist before this stack.
  VercelOidcProviderArn:
    Type: String
    AllowedPattern: '^arn:aws[a-z-]*:iam::[0-9]{12}:oidc-provider/oidc\.vercel\.com(/[a-z0-9][a-z0-9-]{0,62})?$'
    Description: >-
      IAM OIDC provider registered by a person. Global issuer mode: ...:oidc-provider/oidc.vercel.com.
      Team issuer mode: ...:oidc-provider/oidc.vercel.com/<team slug>. The trust condition keys are derived from this ARN.
  VercelTeamSlug:
    Type: String
    AllowedPattern: '^[A-Za-z0-9_-]{1,64}$'
  VercelProjectName:
    Type: String
    AllowedPattern: '^[A-Za-z0-9._-]{1,100}$'
  SesIdentityArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:aws[a-z-]*:ses:[a-z0-9-]+:[0-9]{12}:identity/[A-Za-z0-9.@_-]+$'
    Description: Optional (D-52). A verified SES identity; when set the Vercel role may ses:SendEmail through it only.
  SesFromAddress:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+$'
    Description: Required with SesIdentityArn. The only From address the Vercel role may use.
  EngineDbSecretName:
    Type: String
    Default: alarmops/central/engine-database-url
    AllowedPattern: '^[A-Za-z0-9/_+=.@-]{1,200}$'
  IngestDbSecretName:
    Type: String
    Default: alarmops/central/ingest-database-url
    AllowedPattern: '^[A-Za-z0-9/_+=.@-]{1,200}$'
  AlarmTopicArn:
    Type: String
    Default: ""
    Description: Optional SNS topic notified when a DLQ is not empty.
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 180, 365]
  EngineTimeoutSeconds:
    Type: Number
    Default: 120
    MinValue: 10
    MaxValue: 120
    Description: Engine Lambda timeout. alarm-commands visibility timeout is fixed at 720 s (6 times the maximum).
  EngineReservedConcurrency:
    Type: Number
    Default: 10
    MinValue: 1
  EngineBatchSize:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 10
    Description: SQS event source BatchSize for the engine. 1 keeps the receive count from rising when a batch runs out of time (#123).
  SyncSchedulesState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: State of the periodic-sync schedule rules. DISABLED stops the producer (rollback switch, #123).
  SyncDailySchedule:
    Type: String
    Default: cron(0 18 * * ? *)
    Description: EventBridge schedule of the DAILY sync (UTC). The default is 03:00 KST.
  SyncFanoutSpreadSeconds:
    Type: Number
    Default: 10
    MinValue: 0
    MaxValue: 900
    Description: Seconds between the delayed starts of the per-account sync children (capped so the spread is at most 900 s).
  SyncBusyMaxDeferrals:
    Type: Number
    Default: 5
    AllowedValues: [2, 3, 4, 5, 6, 8, 10, 12, 15, 20]
    Description: >-
      Times a busy scheduled sync child is sent back. This x SyncBusyDeferSeconds must be > 1320 s (stale-run window
      1200 s + engine timeout 120 s); the Rule SyncBusyBudget enforces it (CloudFormation Rules cannot multiply, so both
      parameters take a fixed value list and the Rule lists the allowed pairs). The engine also rejects a violating
      setting at run time (the periodic sync only; every other command keeps working).
  SyncBusyDeferSeconds:
    Type: Number
    Default: 300
    AllowedValues: [120, 180, 300, 450, 600, 900]
    Description: Delay of each busy-deferral copy (SQS DelaySeconds, at most 900). See SyncBusyMaxDeferrals.
  EngineMaxConcurrency:
    Type: Number
    Default: 5
    MinValue: 2
    MaxValue: 1000
    Description: SQS event source MaximumConcurrency for the engine. Keep at or below EngineReservedConcurrency.
  ConsumerReservedConcurrency:
    Type: Number
    Default: 10
    MinValue: 1
  ConsumerMaxConcurrency:
    Type: Number
    Default: 5
    MinValue: 2
    MaxValue: 1000
  WebhookReservedConcurrency:
    Type: Number
    Default: 10
    MinValue: 1
  EventBridgeIngestReservedConcurrency:
    Type: Number
    Default: 10
    MinValue: 1
  WebhookRatePerSecond:
    Type: Number
    Default: 20
    MinValue: 1
  WebhookBurst:
    Type: Number
    Default: 40
    MinValue: 1
  DlqOpsRoleArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:aws[a-z-]*:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$'
    Description: >-
      Optional break-glass role that may receive/delete messages in the alarm-commands DLQ (redrive, inspection).
      Without it nobody but the central role can read the DLQ (the Deny also blocks StartMessageMoveTask).
  RemediationExecution:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: ALARMOPS_REMEDIATION_EXECUTION for the engine (D-15). Stays false until the Slack approval path is live.

Rules:
  # SyncBusyMaxDeferrals x SyncBusyDeferSeconds > 1320 (= 1200 s stale window + 120 s engine timeout, the maximum the
  # EngineTimeoutSeconds parameter allows). Allowed pairs per delay: 120 -> >=12, 180 -> >=8, 300 -> >=5, 450 -> >=3,
  # 600 -> >=3, 900 -> >=2.
  SyncBusyBudget:
    Assertions:
      - Assert:
          Fn::Or:
            - Fn::And:
                - !Equals [!Ref SyncBusyDeferSeconds, "120"]
                - !Contains [["12", "15", "20"], !Ref SyncBusyMaxDeferrals]
            - Fn::And:
                - !Equals [!Ref SyncBusyDeferSeconds, "180"]
                - !Contains [["8", "10", "12", "15", "20"], !Ref SyncBusyMaxDeferrals]
            - Fn::And:
                - !Equals [!Ref SyncBusyDeferSeconds, "300"]
                - !Contains [["5", "6", "8", "10", "12", "15", "20"], !Ref SyncBusyMaxDeferrals]
            - Fn::And:
                - !Contains [["450", "600"], !Ref SyncBusyDeferSeconds]
                - !Contains [["3", "4", "5", "6", "8", "10", "12", "15", "20"], !Ref SyncBusyMaxDeferrals]
            - Fn::And:
                - !Equals [!Ref SyncBusyDeferSeconds, "900"]
                - !Contains [["2", "3", "4", "5", "6", "8", "10", "12", "15", "20"], !Ref SyncBusyMaxDeferrals]
        AssertDescription: SyncBusyMaxDeferrals x SyncBusyDeferSeconds must be greater than 1320 seconds.
  SesNeedsFromAddress:
    RuleCondition: !Not [!Equals [!Ref SesIdentityArn, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref SesFromAddress, ""]]
        AssertDescription: SesFromAddress is required when SesIdentityArn is set.

Conditions:
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, ""]]
  # D-58: the three ARN parameters must belong to THIS account (field 4 of the ARN), whatever the account type.
  # The ":::::" padding keeps index 4 present when a parameter is empty: CloudFormation evaluates every Fn::Select
  # (no short-circuit in !And), and Select on a missing index fails the whole change set.
  # No Organizations feature is involved. A foreign SES identity or DLQ role is ignored (grants nothing); a foreign
  # Vercel OIDC provider leaves the trust statement without a Principal, so the role cannot be created.
  VercelProviderInThisAccount: !Equals [!Select [4, !Split [":", !Join ["", [!Ref VercelOidcProviderArn, ":::::"]]]], !Ref "AWS::AccountId"]
  HasSes: !And
    - !Not [!Equals [!Ref SesIdentityArn, ""]]
    - !Equals [!Select [4, !Split [":", !Join ["", [!Ref SesIdentityArn, ":::::"]]]], !Ref "AWS::AccountId"]
  HasDlqOpsRole: !And
    - !Not [!Equals [!Ref DlqOpsRoleArn, ""]]
    - !Equals [!Select [4, !Split [":", !Join ["", [!Ref DlqOpsRoleArn, ":::::"]]]], !Ref "AWS::AccountId"]
  RemediationEnabled: !Equals [!Ref RemediationExecution, "true"]

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    # No tracing setting here. SAM attaches AWSXrayWriteOnlyAccess for ANY Tracing value (even PassThrough), which the deploy role may
    # not attach and the boundary does not allow (first apply failed on iam:AttachRolePolicy, 11/23).
    PermissionsBoundary: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${PermissionsBoundaryName}"

Resources:
  # ================================================================ secrets (value put by a person)
  # No SecretString here: CloudFormation never sees the connection string. A person runs put-secret-value once
  # (docs/GO-LIVE.md step 4). Two secrets so the engine and ingest use different database users (API-CONTRACT B10).
  EngineDbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Ref EngineDbSecretName
      Description: Postgres connection string for the alarm engine (dedicated DB user). Value set by a person.

  IngestDbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Ref IngestDbSecretName
      Description: Postgres connection string for the ingest Lambdas (dedicated DB user). Value set by a person.

  # ================================================================ queues
  CommandsDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ResourcePrefix}-alarm-commands-dlq"
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  CommandsDlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref CommandsDlq]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # The redrive from CommandsQueue is done by the SQS service and is not affected by these Denies.
          - Sid: DenyReadFromOthers
            Effect: Deny
            Principal: "*"
            Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility]
            Resource: !GetAtt CommandsDlq.Arn
            Condition:
              ArnNotEquals:
                "aws:PrincipalArn": !If
                  - HasDlqOpsRole
                  - [!GetAtt CentralRole.Arn, !Ref DlqOpsRoleArn]
                  - [!GetAtt CentralRole.Arn]
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: sqs:*
            Resource: !GetAtt CommandsDlq.Arn
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  AlertEventsDlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref AlertEventsDlq]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: sqs:*
            Resource: !GetAtt AlertEventsDlq.Arn
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  IngestEventsRuleDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ResourcePrefix}-ingest-events-rule-dlq"
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  IngestEventsRuleDlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref IngestEventsRuleDlq]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: IngestRuleDeadLetters
            Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt IngestEventsRuleDlq.Arn
            Condition:
              ArnEquals: { "aws:SourceArn": !GetAtt IngestAlarmEventsRule.Arn }
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: sqs:*
            Resource: !GetAtt IngestEventsRuleDlq.Arn
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  # Standard queue (D-48); the engine is idempotent per commandId. Visibility 720 = 6 x the maximum engine timeout.
  CommandsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ResourcePrefix}-alarm-commands"
      SqsManagedSseEnabled: true
      VisibilityTimeout: 720
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CommandsDlq.Arn
        maxReceiveCount: 5

  # Delivery of CloudTrail tag events from the bus rule. Own DLQ: the rule's DLQ needs a policy for events.amazonaws.com
  # that must not leak to the redrive DLQ of the queue.
  TagEventsRuleDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ResourcePrefix}-tag-events-rule-dlq"
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  # Delivery of the periodic-sync schedule rules (#123). Own DLQ and policy: scoped to the two schedule rules only.
  SyncScheduleRuleDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ResourcePrefix}-sync-schedule-rule-dlq"
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  AlertEventsDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ResourcePrefix}-alert-events-dlq"
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  # Visibility 180 = 6 x the consumer timeout (30 s; assertBudget in services/ingest keeps the budget below it).
  AlertEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ResourcePrefix}-alert-events"
      SqsManagedSseEnabled: true
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AlertEventsDlq.Arn
        maxReceiveCount: 5

  # Security review (hkjs96/alarmops#47, engine-collectors #10; #123):
  #  - the only Allow for events.amazonaws.com is bound to exactly 3 rule ARNs (ArnEquals aws:SourceArn): the tag-event
  #    rule on the central bus and the two periodic-sync schedule rules on the default bus. No Principal "*" in any
  #    Allow, no aws:SourceAccount-only condition.
  #  - DenySendFromOthers: both ArnNotEquals must hold (AND) for the Deny to apply, so the console role, CentralRole
  #    (the engine sends fan-out children and deferred copies back) and those three rules are the only senders.
  CommandsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref CommandsQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ConsoleAndEngineSend
            Effect: Allow
            Principal: { AWS: [!GetAtt VercelConsoleRole.Arn, !GetAtt CentralRole.Arn] }
            Action: sqs:SendMessage
            Resource: !GetAtt CommandsQueue.Arn
          - Sid: TagEventRuleSend
            Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt CommandsQueue.Arn
            Condition:
              ArnEquals:
                "aws:SourceArn": [!GetAtt TagEventRule.Arn, !GetAtt SyncHourlyRule.Arn, !GetAtt SyncDailyRule.Arn]
          - Sid: EngineReceiveDelete
            Effect: Allow
            Principal: { AWS: !GetAtt CentralRole.Arn }
            Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility]
            Resource: !GetAtt CommandsQueue.Arn
          - Sid: DenySendFromOthers
            Effect: Deny
            Principal: "*"
            Action: sqs:SendMessage
            Resource: !GetAtt CommandsQueue.Arn
            Condition:
              ArnNotEquals:
                "aws:PrincipalArn": [!GetAtt VercelConsoleRole.Arn, !GetAtt CentralRole.Arn]
                "aws:SourceArn": [!GetAtt TagEventRule.Arn, !GetAtt SyncHourlyRule.Arn, !GetAtt SyncDailyRule.Arn]
          - Sid: DenyReceiveFromOthers
            Effect: Deny
            Principal: "*"
            Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility]
            Resource: !GetAtt CommandsQueue.Arn
            Condition:
              ArnNotEquals: { "aws:PrincipalArn": !GetAtt CentralRole.Arn }
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: sqs:*
            Resource: !GetAtt CommandsQueue.Arn
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  SyncScheduleRuleDlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref SyncScheduleRuleDlq]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SyncScheduleRulesDeadLetter
            Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt SyncScheduleRuleDlq.Arn
            Condition:
              ArnEquals:
                "aws:SourceArn": [!GetAtt SyncHourlyRule.Arn, !GetAtt SyncDailyRule.Arn]
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: sqs:*
            Resource: !GetAtt SyncScheduleRuleDlq.Arn
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  TagEventsRuleDlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref TagEventsRuleDlq]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TagEventRuleDeadLetters
            Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt TagEventsRuleDlq.Arn
            Condition:
              ArnEquals: { "aws:SourceArn": !GetAtt TagEventRule.Arn }
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: sqs:*
            Resource: !GetAtt TagEventsRuleDlq.Arn
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  AlertEventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref AlertEventsQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ProducersSend
            Effect: Allow
            Principal:
              AWS:
                - !GetAtt IngestWebhookFunctionRole.Arn
                - !GetAtt IngestEventBridgeFunctionRole.Arn
                - !GetAtt AlertConsumerFunctionRole.Arn
            Action: sqs:SendMessage
            Resource: !GetAtt AlertEventsQueue.Arn
          - Sid: ConsumerReceiveDelete
            Effect: Allow
            Principal: { AWS: !GetAtt AlertConsumerFunctionRole.Arn }
            Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility]
            Resource: !GetAtt AlertEventsQueue.Arn
          - Sid: DenySendFromOthers
            Effect: Deny
            Principal: "*"
            Action: sqs:SendMessage
            Resource: !GetAtt AlertEventsQueue.Arn
            Condition:
              ArnNotEquals:
                "aws:PrincipalArn":
                  - !GetAtt IngestWebhookFunctionRole.Arn
                  - !GetAtt IngestEventBridgeFunctionRole.Arn
                  - !GetAtt AlertConsumerFunctionRole.Arn
          - Sid: DenyReceiveFromOthers
            Effect: Deny
            Principal: "*"
            Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility]
            Resource: !GetAtt AlertEventsQueue.Arn
            Condition:
              ArnNotEquals: { "aws:PrincipalArn": !GetAtt AlertConsumerFunctionRole.Arn }
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: sqs:*
            Resource: !GetAtt AlertEventsQueue.Arn
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  # ================================================================ central bus rule -> alarm-commands
  # Events arrive from allow-listed customer accounts (central-bus.yaml). The envelope's top-level `account` is set
  # by EventBridge; the engine trusts only that field (services/alarm-engine events.py).
  TagEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ResourcePrefix}-tag-events-to-commands"
      Description: CloudTrail tag add/remove events from customer accounts to the alarm-commands queue (D-16).
      EventBusName: !Ref CentralBusName
      State: ENABLED
      EventPattern:
        source:
          - prefix: "aws."
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          # Exactly the tag APIs services/alarm-engine handles (events.py TAG_EVENTS, the same list as the customer
          # TagChangeRule). A failed call (errorCode present) changed nothing and is dropped here.
          eventSource:
            - suffix: ".amazonaws.com"
          eventName:
            - CreateTags
            - DeleteTags
            - AddTagsToResource
            - RemoveTagsFromResource
            - AddTags
            - RemoveTags
            - TagResource
            - UntagResource
            - TagResources
            - UntagResources
            - TagQueue
            - UntagQueue
          errorCode:
            - exists: false
      Targets:
        - Id: alarm-commands
          Arn: !GetAtt CommandsQueue.Arn
          DeadLetterConfig:
            Arn: !GetAtt TagEventsRuleDlq.Arn
          RetryPolicy:
            MaximumRetryAttempts: 10
            MaximumEventAgeInSeconds: 3600

  # ================================================================ periodic sync schedule rules -> alarm-commands (#123)
  # Schedule rules only exist on the default bus (not CentralBusName). Each sends one SYNC_ALL_ACCOUNTS command; the
  # engine fans it out per account. commandId carries the fire time so a redelivery is the same command.
  SyncHourlyRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ResourcePrefix}-sync-hourly"
      Description: Hourly TAG_RECONCILE of every active account (catches tag events the debounce dropped).
      ScheduleExpression: rate(1 hour)
      State: !Ref SyncSchedulesState
      Targets:
        - Id: alarm-commands
          Arn: !GetAtt CommandsQueue.Arn
          InputTransformer:
            InputPathsMap:
              t: $.time
            InputTemplate: '{"schemaVersion":1,"commandId":"sched-TAG_RECONCILE-<t>","type":"SYNC_ALL_ACCOUNTS","customerId":"system","payload":{"mode":"TAG_RECONCILE"}}'
          DeadLetterConfig:
            Arn: !GetAtt SyncScheduleRuleDlq.Arn
          RetryPolicy:
            MaximumRetryAttempts: 10
            MaximumEventAgeInSeconds: 3600

  SyncDailyRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ResourcePrefix}-sync-daily"
      Description: Daily full sync (DAILY) of every active account.
      ScheduleExpression: !Ref SyncDailySchedule
      State: !Ref SyncSchedulesState
      Targets:
        - Id: alarm-commands
          Arn: !GetAtt CommandsQueue.Arn
          InputTransformer:
            InputPathsMap:
              t: $.time
            InputTemplate: '{"schemaVersion":1,"commandId":"sched-DAILY-<t>","type":"SYNC_ALL_ACCOUNTS","customerId":"system","payload":{"mode":"DAILY"}}'
          DeadLetterConfig:
            Arn: !GetAtt SyncScheduleRuleDlq.Arn
          RetryPolicy:
            MaximumRetryAttempts: 10
            MaximumEventAgeInSeconds: 3600

  # ================================================================ roles
  # CentralRole: the ONE role customer stacks trust (their CentralRoleArn parameter). It is also the alarm-engine
  # Lambda's execution role, so the identity that assumes customer roles is the code that holds the DB secret and
  # the queue (decision: single role; see infra/aws/README.md).
  #  - sts:AssumeRole only on AlarmOps-* roles in any account; the customer side requires sts:ExternalId.
  #  - Explicit Deny on AlarmOps-Remediator: stopping/deleting goes only through RemediatorCallerRole (D-15).
  CentralRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${PermissionsBoundaryName}"
      RoleName: AlarmOpsCentral-Engine
      Description: Alarm engine; the role customers trust. Assumes customer AlarmOps-* roles with ExternalId.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref "AWS::AccountId" }
      Policies:
        - PolicyName: engine
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AssumeCustomerRoles
                Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub "arn:${AWS::Partition}:iam::*:role/AlarmOps-*"
                # Never assume without an ExternalId (D-07); the customer side additionally checks its value.
                Condition:
                  "Null": { "sts:ExternalId": "false" }
              - Sid: NeverAssumeCustomerRemediator
                Effect: Deny
                Action: sts:AssumeRole
                Resource: !Sub "arn:${AWS::Partition}:iam::*:role/AlarmOps-Remediator"
              # D-15: only exists while RemediationExecution is "true", so the default (false) is enforced by IAM.
              # The Deny above is a guardrail; the Slack approval itself is enforced in the backend code.
              - !If
                - RemediationEnabled
                - Sid: AssumeRemediatorCaller
                  Effect: Allow
                  Action: sts:AssumeRole
                  Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/AlarmOpsCentral-RemediatorCaller"
                - !Ref AWS::NoValue
              - Sid: ConsumeAlarmCommands
                Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility]
                Resource: !GetAtt CommandsQueue.Arn
              # #123: fan-out children and deferred copies go back to the same queue (the only send right added).
              - Sid: SendSyncCommands
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt CommandsQueue.Arn
              - Sid: ReadEngineDbSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref EngineDbSecret
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${EngineLogGroup.Arn}:*"

  # Second central identity, only for approved remediations (customer RemediatorCallerRoleArn). Reachable only from
  # CentralRole; carries no queue, secret or discovery rights. Customers' AlarmOps-Remediator still requires ExternalId.
  RemediatorCallerRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${PermissionsBoundaryName}"
      RoleName: AlarmOpsCentral-RemediatorCaller
      Description: Assumed by the engine only to run a Slack-approved remediation in a customer account.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !GetAtt CentralRole.Arn }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: assume-customer-remediator
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub "arn:${AWS::Partition}:iam::*:role/AlarmOps-Remediator"
                Condition:
                  "Null": { "sts:ExternalId": "false" }

  # Vercel console (D-49): web identity from the Vercel OIDC provider, pinned to this team's aud and to the
  # production environment of this one project. Permission: sqs:SendMessage on alarm-commands (+ optional SES, D-52).
  VercelConsoleRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${PermissionsBoundaryName}"
      RoleName: AlarmOpsCentral-VercelConsole
      Description: Vercel console (production) sends alarm commands. Nothing else.
      MaxSessionDuration: 3600
      # Condition keys are "<provider path>:aud|sub": oidc.vercel.com (Global) or oidc.vercel.com/<team> (Team issuer).
      # CloudFormation cannot compute map keys, so the document is a JSON string (Sub) with the prefix taken from the provider ARN.
      # Without a provider in this account the Principal is empty, which IAM rejects: nobody can assume the role.
      AssumeRolePolicyDocument: !If
        - VercelProviderInThisAccount
        - !Sub
          - |
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"${VercelOidcProviderArn}"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringEquals":{"${OidcKeyPrefix}:aud":"https://vercel.com/${VercelTeamSlug}","${OidcKeyPrefix}:sub":"owner:${VercelTeamSlug}:project:${VercelProjectName}:environment:production"}}}]}
          - OidcKeyPrefix: !Select [1, !Split ["oidc-provider/", !Ref VercelOidcProviderArn]]
        - !Sub
          - |
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringEquals":{"${OidcKeyPrefix}:aud":"https://vercel.com/${VercelTeamSlug}","${OidcKeyPrefix}:sub":"owner:${VercelTeamSlug}:project:${VercelProjectName}:environment:production"}}}]}
          - OidcKeyPrefix: !Select [1, !Split ["oidc-provider/", !Ref VercelOidcProviderArn]]
      Policies:
        - PolicyName: console
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SendAlarmCommands
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt CommandsQueue.Arn
              - !If
                - HasSes
                - Sid: SendEmailFromVerifiedIdentity
                  Effect: Allow
                  Action: ses:SendEmail
                  Resource: !Ref SesIdentityArn
                  Condition:
                    StringEquals: { "ses:FromAddress": !Ref SesFromAddress }
                - !Ref AWS::NoValue

  # ================================================================ log groups
  EngineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ResourcePrefix}-alarm-engine"
      RetentionInDays: !Ref LogRetentionDays

  WebhookLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ResourcePrefix}-ingest-webhook"
      RetentionInDays: !Ref LogRetentionDays

  EventBridgeIngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ResourcePrefix}-ingest-eventbridge"
      RetentionInDays: !Ref LogRetentionDays

  ConsumerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ResourcePrefix}-alert-consumer"
      RetentionInDays: !Ref LogRetentionDays

  # ================================================================ alarm engine
  AlarmEngineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ResourcePrefix}-alarm-engine"
      CodeUri: ../../services/alarm-engine/build/
      Handler: alarm_engine.handler.lambda_handler
      Runtime: python3.12
      Architectures: [arm64]
      Timeout: !Ref EngineTimeoutSeconds
      MemorySize: 512
      ReservedConcurrentExecutions: !Ref EngineReservedConcurrency
      Role: !GetAtt CentralRole.Arn
      LoggingConfig:
        LogGroup: !Ref EngineLogGroup
      Environment:
        Variables:
          # The value is read from Secrets Manager at cold start (never placed in the template or the console).
          DATABASE_URL_SECRET_ARN: !Ref EngineDbSecret
          ALARMOPS_REMEDIATION_EXECUTION: !Ref RemediationExecution
          REMEDIATOR_CALLER_ROLE_ARN: !If [RemediationEnabled, !GetAtt RemediatorCallerRole.Arn, !Ref "AWS::NoValue"]
          # #123: the engine sends the fan-out children and deferred copies back to its own queue.
          COMMANDS_QUEUE_URL: !Ref CommandsQueue
          ENGINE_TIMEOUT_SECONDS: !Ref EngineTimeoutSeconds   # the engine derives its dead-run window from this
          SYNC_FANOUT_SPREAD_SECONDS: !Ref SyncFanoutSpreadSeconds
          SYNC_BUSY_MAX_DEFERRALS: !Ref SyncBusyMaxDeferrals
          SYNC_BUSY_DEFER_SECONDS: !Ref SyncBusyDeferSeconds
      Events:
        Commands:
          Type: SQS
          Properties:
            Queue: !GetAtt CommandsQueue.Arn
            # 1: a record of a batch that has no time left is returned unread, so the receive count only rises on a
            # real failure (#123 simulation). Raise only together with the fan-out spread.
            BatchSize: !Ref EngineBatchSize
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: !Ref EngineMaxConcurrency

  # ================================================================ ingest
  # Function roles (SAM-generated) get exactly: send to alert-events, read the ingest DB secret, logs.
  IngestWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ResourcePrefix}-ingest-webhook"
      CodeUri: ../../services/ingest/dist/webhook/
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      ReservedConcurrentExecutions: !Ref WebhookReservedConcurrency
      LoggingConfig:
        LogGroup: !Ref WebhookLogGroup
      Environment:
        Variables:
          ALERT_EVENTS_QUEUE_URL: !Ref AlertEventsQueue
          DATABASE_URL_SECRET_ARN: !Ref IngestDbSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt AlertEventsQueue.Arn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref IngestDbSecret
      Events:
        Webhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref IngestHttpApi
            Method: POST
            Path: /ingest/v1/{source}

  # No access log: the customer token may arrive in the query string and must not be written anywhere.
  IngestHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref WebhookRatePerSecond
        ThrottlingBurstLimit: !Ref WebhookBurst

  IngestEventBridgeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ResourcePrefix}-ingest-eventbridge"
      CodeUri: ../../services/ingest/dist/eventbridge/
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      ReservedConcurrentExecutions: !Ref EventBridgeIngestReservedConcurrency
      LoggingConfig:
        LogGroup: !Ref EventBridgeIngestLogGroup
      Environment:
        Variables:
          ALERT_EVENTS_QUEUE_URL: !Ref AlertEventsQueue
          DATABASE_URL_SECRET_ARN: !Ref IngestDbSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt AlertEventsQueue.Arn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref IngestDbSecret

  # Explicit rule (not the SAM EventBridgeRule event) so the DLQ is ours: SSE, TLS-only, one-rule send policy.
  IngestAlarmEventsRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ResourcePrefix}-alarm-events-to-ingest"
      Description: CloudWatch alarm state and configuration changes from customer accounts to the ingest Lambda.
      EventBusName: !Ref CentralBusName
      State: ENABLED
      EventPattern:
        source: [aws.cloudwatch]
        detail-type: [CloudWatch Alarm State Change, CloudWatch Alarm Configuration Change]
      Targets:
        - Id: ingest-eventbridge
          Arn: !GetAtt IngestEventBridgeFunction.Arn
          DeadLetterConfig:
            Arn: !GetAtt IngestEventsRuleDlq.Arn
          RetryPolicy:
            MaximumRetryAttempts: 10
            MaximumEventAgeInSeconds: 3600

  IngestAlarmEventsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngestEventBridgeFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt IngestAlarmEventsRule.Arn

  AlertConsumerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ResourcePrefix}-alert-consumer"
      CodeUri: ../../services/ingest/dist/consumer/
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      Timeout: 30
      ReservedConcurrentExecutions: !Ref ConsumerReservedConcurrency
      LoggingConfig:
        LogGroup: !Ref ConsumerLogGroup
      Environment:
        Variables:
          ALERT_EVENTS_QUEUE_URL: !Ref AlertEventsQueue
          DATABASE_URL_SECRET_ARN: !Ref IngestDbSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt AlertEventsQueue.Arn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref IngestDbSecret
      Events:
        AlertEvents:
          Type: SQS
          Properties:
            Queue: !GetAtt AlertEventsQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: !Ref ConsumerMaxConcurrency

  # ================================================================ DLQ alarms
  CommandsDlqNotEmptyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ResourcePrefix}-alarm-commands-dlq-not-empty"
      AlarmDescription: Commands the engine could not process. An offboarding command may be among them.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CommandsDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref "AWS::NoValue"]

  AlertEventsDlqNotEmptyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ResourcePrefix}-alert-events-dlq-not-empty"
      AlarmDescription: Alert events the consumer could not process (alerts may be lost).
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AlertEventsDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref "AWS::NoValue"]

  IngestEventsRuleDlqNotEmptyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ResourcePrefix}-ingest-events-rule-dlq-not-empty"
      AlarmDescription: Alarm events the bus rule could not deliver to the ingest Lambda.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt IngestEventsRuleDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref "AWS::NoValue"]

  TagEventsRuleDlqNotEmptyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ResourcePrefix}-tag-events-rule-dlq-not-empty"
      AlarmDescription: Tag events the bus rule could not deliver to alarm-commands.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt TagEventsRuleDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref "AWS::NoValue"]

  SyncScheduleRuleDlqNotEmptyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ResourcePrefix}-sync-schedule-rule-dlq-not-empty"
      AlarmDescription: Periodic sync commands the schedule rules could not deliver to alarm-commands.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SyncScheduleRuleDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref "AWS::NoValue"]

Outputs:
  AlarmCommandsQueueUrl:
    Value: !Ref CommandsQueue
    Description: Vercel env ALARM_COMMANDS_QUEUE_URL.
  AlarmCommandsQueueArn:
    Value: !GetAtt CommandsQueue.Arn
  AlertEventsQueueUrl:
    Value: !Ref AlertEventsQueue
  AlertEventsQueueArn:
    Value: !GetAtt AlertEventsQueue.Arn
  CentralRoleArn:
    Value: !GetAtt CentralRole.Arn
    Description: Customer stack parameter CentralRoleArn.
  RemediatorCallerRoleArn:
    Value: !GetAtt RemediatorCallerRole.Arn
    Description: Customer stack parameter RemediatorCallerRoleArn (only when EnableRemediator).
  VercelConsoleRoleArn:
    Value: !GetAtt VercelConsoleRole.Arn
    Description: Vercel env AWS_ROLE_ARN.
  CentralBusArn:
    Value: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/${CentralBusName}"
    Description: Customer stack parameter CentralEventBusArn.
  CentralAccountId:
    Value: !Ref "AWS::AccountId"
    Description: Vercel env ALARM_COMMANDS_EXPECTED_ACCOUNT.
  WebhookUrl:
    Value: !Sub "https://${IngestHttpApi}.execute-api.${AWS::Region}.amazonaws.com/ingest/v1/{source}"
  EngineDbSecretArn:
    Value: !Ref EngineDbSecret
    Description: Put the connection string here (docs/GO-LIVE.md). The ARN is not a secret.
  IngestDbSecretArn:
    Value: !Ref IngestDbSecret
