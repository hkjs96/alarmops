name: dev-db

# Applies db/prisma/migrations to the dev Supabase database with `prisma migrate deploy`.
# `prisma db push` is never used (D-10). Setup: docs/SETUP-SUPABASE.md

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate" to apply pending migrations to the dev database'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "db/prisma/**"

permissions:
  contents: read

concurrency:
  group: dev-db
  cancel-in-progress: false

# Runners are pinned to ubuntu-24.04, like ci.yml (see the note there).
#
# Follow-up (security review of 2026-11-11, 권고 2): pin the actions below to full commit SHAs instead of major
# tags, this workflow first because it is the one that reads secrets. The SHAs are to be copied from each action's
# release page by a person (or by Dependabot); they are not guessed here.
#
# The two connection strings are given only to the steps that need them (the check and the Prisma commands), not to
# the whole job: `npm ci` runs the install scripts of every dependency and has no use for them.
# The `dev` environment must allow the `main` branch only and have a required reviewer (docs/SETUP-SUPABASE.md,
# step 4): workflow_dispatch runs the workflow file of whatever branch it is started from.
jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: dev
    steps:
      - name: Check confirmation
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "migrate" ]; then
            echo "::error::Nothing was changed. To run this, type exactly: migrate"
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      # Fails the job when a secret is missing or is not a connection string. Runs before anything else could print one.
      - name: Check the connection strings and hide them in the log
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DEV_DIRECT_URL }}
        run: node .github/scripts/mask-db-urls.mjs
      - run: npm ci
      - name: Status before
        working-directory: db
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DEV_DIRECT_URL }}
        run: |
          set +e
          npx prisma migrate status > "$RUNNER_TEMP/status-before.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/status-before.log"
          # Exit 1 with pending migrations is the normal case here. Stop only when the database was not reached.
          if [ "$code" -ne 0 ] && ! grep -qE "have not yet been applied|Database schema is up to date" "$RUNNER_TEMP/status-before.log"; then
            echo "::error::Could not read the migration status of the dev database. Check DEV_DIRECT_URL (session connection, port 5432) and the database password."
            exit 1
          fi
      - name: Apply migrations (prisma migrate deploy)
        working-directory: db
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DEV_DIRECT_URL }}
        run: |
          set -o pipefail
          npx prisma migrate deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
      - name: Status after
        working-directory: db
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DEV_DIRECT_URL }}
        run: npx prisma migrate status
      - name: Applied migrations
        run: |
          applied=$(grep -oE 'Applying migration `[^`]+`' "$RUNNER_TEMP/deploy.log" | sed -E 's/.*`([^`]+)`/- \1/' || true)
          {
            echo "### dev database migrations"
            echo
            echo "Applied in this run:"
            if [ -n "$applied" ]; then echo "$applied"; else echo "- (none, already up to date)"; fi
            echo
            echo "All migrations now in the dev database:"
            find db/prisma/migrations -mindepth 1 -maxdepth 1 -type d -printf '- %f\n' | sort
          } | tee -a "$GITHUB_STEP_SUMMARY"
