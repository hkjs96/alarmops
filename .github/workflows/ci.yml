name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

# Runners are pinned to ubuntu-24.04: ubuntu-latest moved to 26.04, which Playwright 1.56 cannot install
# Chromium on. Move all jobs together once the installed @playwright/test supports the newer image.
#
# Follow-up (security review of 2026-11-11, 권고 2): pin the actions to full commit SHAs instead of major tags, and
# the postgres:16 image to a digest. dev-db.yml first (it reads secrets). The SHAs are to be copied from each
# action's release page by a person (or by Dependabot); they are not guessed here.
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (console)
        run: npm run lint -w @alarmops/console
      - name: Unit tests (all workspaces)
        run: npm test
      - name: Build (console)
        run: npm run build -w @alarmops/console

  engine:
    # services/alarm-engine is Python (D-05 port, Lambda); not an npm workspace (no package.json there).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/alarm-engine/requirements-dev.txt
      - run: pip install -r services/alarm-engine/requirements-dev.txt
      - name: Lint and type check (alarm engine)
        run: npm run lint:engine
      - name: Tests (alarm engine, all AWS calls mocked)
        run: npm run test:engine

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The run starts its own server with the mock API (playwright.config.ts) and fails if the port is taken.
      PW_NO_REUSE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      # The browser is one download. Its system packages come from the runner's apt mirror, which at times cannot be
      # resolved for minutes ("Temporary failure resolving", 2026-11-11, two runs in a row): apt is tried three times.
      # If it still fails the run goes on with what the runner image already has (it ships Chrome's libraries) and
      # says so; a library that is really missing then fails the tests at browser start, with its name.
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
        working-directory: apps/console
      - name: Install system packages for Chromium
        working-directory: apps/console
        run: |
          for attempt in 1 2 3; do
            if timeout 240 npx playwright install-deps chromium; then exit 0; fi
            echo "install-deps failed (attempt $attempt of 3)"
            sleep $((attempt * 20))
          done
          echo "::warning::Could not install Chromium's system packages (apt mirror not reachable). Continuing with the packages of the runner image."
      - name: Build (console)
        run: npm run build -w @alarmops/console
      - name: End-to-end tests (mock mode)
        run: npx playwright test --reporter=list,html
        working-directory: apps/console
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            apps/console/playwright-report/
            apps/console/test-results/
          if-no-files-found: ignore
          retention-days: 7

  db:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alarmops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alarmops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Throwaway database inside this job only. Not a secret.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alarmops
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/alarmops
      # Second database on the same server: `migrate diff` replays the migrations there and wipes it.
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alarmops_shadow
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Workflow script tests (drift check, connection string check)
        run: node --test .github/scripts/check-migration-drift.test.mjs .github/scripts/mask-db-urls.test.mjs
      - name: Prisma generate
        run: npx prisma generate
        working-directory: db
      - name: Create Supabase-like roles anon / authenticated (so the migrations' guarded REVOKE runs)
        run: docker exec "${{ job.services.postgres.id }}" psql -U postgres -d alarmops -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; GRANT ALL ON SCHEMA public TO anon, authenticated; ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon, authenticated;"
      - name: Apply migrations (prisma migrate deploy)
        run: npx prisma migrate deploy
        working-directory: db
      - name: Every public table has RLS on, not forced, no policies (D-40)
        run: npm run check:rls -w @alarmops/db
      - name: Create shadow database
        run: docker exec "${{ job.services.postgres.id }}" createdb -U postgres alarmops_shadow
      - name: Migrations match schema.prisma (prisma migrate diff)
        working-directory: db
        run: |
          set +e
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --script --exit-code > "$RUNNER_TEMP/drift.sql"
          code=$?
          set -e
          echo "prisma migrate diff exit code: $code (0 = no difference, 2 = difference, other = error)"
          cat "$RUNNER_TEMP/drift.sql"
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "::error::prisma migrate diff could not run (exit $code)"
            exit 1
          fi
          node ../.github/scripts/check-migration-drift.mjs "$RUNNER_TEMP/drift.sql" prisma/migrations
      - name: Migration status is clean
        run: npx prisma migrate status
        working-directory: db
      - name: Integration tests against Postgres (when present)
        run: |
          npm run test:db -w @alarmops/db --if-present
          npm run test:sql --workspaces --if-present
        env:
          # store-sql's real-Postgres suite. It creates one schema per test file, so it
          # runs against the service's default database, separate from the migrated one.
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
