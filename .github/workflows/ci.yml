name: ci

# Which jobs run (job-level `if:` on the outputs of the `changes` job; a skipped job does not block required checks).
# The mapping is .github/scripts/ci-changes.sh; keep this table in sync with it.
#
#   changed path                                   jobs that run
#   apps/**                                        test, e2e, e2e-live
#   packages/** (not store-sql)                    test, e2e, e2e-live
#   packages/store-sql/**                          test, e2e, e2e-live, db
#   services/ingest/**                             test
#   services/alarm-engine/**                       engine, infra (infra tests read its sources)
#   db/** (not db/sql)                             test, e2e-live, engine, db (engine's Postgres tests use the migrations)
#   db/sql/**                                      the line above + infra (infra tests read roles.sql)
#   infra/**                                       infra
#   .github/scripts/**                             infra, db (both run the script tests)
#   docs/**, root *.md, .env.example, .gitignore,  nothing (docs_only). Exceptions that tests read:
#     .claude/worktrees/**                         docs/specs/alarm-rules.md -> engine, docs/SETUP-PROD-DB.md -> infra, docs/GO-LIVE.md -> infra,
#                                                  tools/vercel-cli/** -> infra, the offboard-account.command.json
#                                                  fixtures (packages/api, alarm-engine) -> test + engine.
#   *.md inside an area                            follows that area's rule (e.g. infra/aws/*.md -> infra)
#   .claude/** (not worktrees)                     everything (unmapped)
#
# Push to main uses the same table on the pushed range (before..after), so a squash merge runs what its PR ran.
# ALWAYS everything: a push whose range is not linear (force push, new branch), workflow_dispatch, .github/workflows/**,
# package.json, package-lock.json, tsconfig*, .npmrc/.nvmrc, .github/scripts/ci-changes.*, an empty diff, a path not listed above, and any
# failure of the changes job (fail-safe: a job is skipped only when its output is exactly 'false').
# Renames count as delete + add, so the old path is judged too. There is no docs-site build check in CI.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

# Runners are pinned to ubuntu-24.04: ubuntu-latest moved to 26.04, which Playwright 1.56 cannot install
# Chromium on. Move all jobs together once the installed @playwright/test supports the newer image.
#
# Follow-up (security review of 2026-11-11, 권고 2): pin the actions to full commit SHAs instead of major tags, and
# the postgres:16 image to a digest. dev-db.yml first (it reads secrets). The SHAs are to be copied from each
# action's release page by a person (or by Dependabot); they are not guessed here.
jobs:
  # Decides which of the jobs below run. The logic is .github/scripts/ci-changes.sh (tested by ci-changes.test.mjs).
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      test: ${{ steps.diff.outputs.test }}
      e2e: ${{ steps.diff.outputs.e2e }}
      e2e_live: ${{ steps.diff.outputs.e2e_live }}
      engine: ${{ steps.diff.outputs.engine }}
      db: ${{ steps.diff.outputs.db }}
      infra: ${{ steps.diff.outputs.infra }}
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          set -euo pipefail
          # Written to a file first so the script's exit code is not hidden by a pipe. The script prints all=true on
          # any internal failure or incomplete answer; a non-zero exit here fails the job, and the jobs then run anyway.
          bash .github/scripts/ci-changes.sh > "$RUNNER_TEMP/ci-changes.out"
          cat "$RUNNER_TEMP/ci-changes.out"
          cat "$RUNNER_TEMP/ci-changes.out" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    # Skipped only when changes says 'false'. A failed or empty answer runs the job (fail-safe).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.test != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (console)
        run: npm run lint -w @alarmops/console
      - name: Unit tests (all workspaces)
        run: npm test
      - name: Build (console)
        run: npm run build -w @alarmops/console

  engine:
    needs: changes
    # Skipped only when changes says 'false'. A failed or empty answer runs the job (fail-safe).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.engine != 'false') }}
    # services/alarm-engine is Python (D-05 port, Lambda); not an npm workspace (no package.json there).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Throwaway server inside this job only. Not a secret. tests/test_pg_repository.py creates its own database on it
      # (from db/prisma/migrations) and drops it, so it cannot touch anything else. Without this variable those tests
      # are skipped (offboarding queries, D-43).
      ALARM_ENGINE_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/alarm-engine/requirements-dev.txt
      - run: pip install -r services/alarm-engine/requirements-dev.txt
      - name: Lint and type check (alarm engine)
        run: npm run lint:engine
      - name: Tests (alarm engine, all AWS calls mocked)
        run: npm run test:engine
      # A skip would mean the Postgres tests silently stopped running (variable renamed, service not reachable).
      - name: Postgres tests ran (not skipped)
        working-directory: services/alarm-engine
        run: |
          set -o pipefail
          python -m pytest tests/test_pg_repository.py -q -rs 2>&1 | tee "$RUNNER_TEMP/pg-tests.log"
          if grep -qiE "skipped" "$RUNNER_TEMP/pg-tests.log"; then
            echo "::error::The Postgres tests were skipped. ALARM_ENGINE_TEST_PG_URL must point at the postgres service."
            exit 1
          fi

  # Offline checks of the infrastructure templates and the workflow helper scripts. No AWS access, no credentials.
  infra:
    needs: changes
    # Skipped only when changes says 'false'. A failed or empty answer runs the job (fail-safe).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.infra != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "cfn-lint==1.60.1"
      - name: cfn-lint (customer stack, central bus, central SAM bundle, bootstrap, alerts)
        run: cfn-lint infra/customer-stack/template.yaml infra/aws/central-bus.yaml infra/aws/central.yaml infra/aws/central-bootstrap.yaml infra/aws/central-alerts.yaml
      - name: Template structure tests (roles, trust, Deny rules)
        run: python -m unittest discover -s infra/test -v
      - name: Workflow script tests (console deploy environment check, bus allow list)
        run: node --test .github/scripts/check-console-deploy-env.test.mjs .github/scripts/smoke-console.test.mjs .github/scripts/strip-deploy-env.test.mjs .github/scripts/bus-allowlist.test.mjs .github/scripts/ci-changes.test.mjs

  e2e:
    needs: changes
    # Skipped only when changes says 'false'. A failed or empty answer runs the job (fail-safe).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.e2e != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The run starts its own server with the mock API (playwright.config.ts) and fails if the port is taken.
      PW_NO_REUSE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      # The browser is one download. Its system packages come from the runner's apt mirror, which at times cannot be
      # resolved for minutes ("Temporary failure resolving", 2026-11-11, two runs in a row): apt is tried three times.
      # If it still fails the run goes on with what the runner image already has (it ships Chrome's libraries) and
      # says so; a library that is really missing then fails the tests at browser start, with its name.
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
        working-directory: apps/console
      - name: Install system packages for Chromium
        working-directory: apps/console
        run: |
          for attempt in 1 2 3; do
            if timeout 240 npx playwright install-deps chromium; then exit 0; fi
            echo "install-deps failed (attempt $attempt of 3)"
            sleep $((attempt * 20))
          done
          echo "::warning::Could not install Chromium's system packages (apt mirror not reachable). Continuing with the packages of the runner image."
      - name: Build (console)
        run: npm run build -w @alarmops/console
      - name: End-to-end tests (mock mode)
        run: npx playwright test --reporter=list,html
        working-directory: apps/console
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            apps/console/playwright-report/
            apps/console/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The real stack: console (MOCK_API unset) + packages/api + store-sql on a postgres:16 service, seeded by the db seed.
  # apps/console/playwright.live.config.ts creates a fresh database from the migrations and starts `next dev`
  # (the live dev sign-in exists only outside production).
  e2e-live:
    needs: changes
    # Skipped only when changes says 'false'. A failed or empty answer runs the job (fail-safe).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.e2e_live != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Throwaway server inside this job only. Not a secret.
      LIVE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Chromium
        working-directory: apps/console
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (live API + Postgres)
        working-directory: apps/console
        run: npx playwright test -c playwright.live.config.ts --reporter=list

  db:
    needs: changes
    # Skipped only when changes says 'false'. A failed or empty answer runs the job (fail-safe).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.db != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alarmops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alarmops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Throwaway database inside this job only. Not a secret.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alarmops
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/alarmops
      # Second database on the same server: `migrate diff` replays the migrations there and wipes it.
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alarmops_shadow
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Workflow script tests (drift check, connection string check)
        run: node --test .github/scripts/check-migration-drift.test.mjs .github/scripts/mask-db-urls.test.mjs .github/scripts/check-console-deploy-env.test.mjs .github/scripts/smoke-console.test.mjs .github/scripts/strip-deploy-env.test.mjs .github/scripts/bus-allowlist.test.mjs
      - name: Prisma generate
        run: npx prisma generate
        working-directory: db
      - name: Create Supabase-like roles anon / authenticated (so the migrations' guarded REVOKE runs)
        run: docker exec "${{ job.services.postgres.id }}" psql -U postgres -d alarmops -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; GRANT ALL ON SCHEMA public TO anon, authenticated; ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon, authenticated;"
      - name: Apply migrations (prisma migrate deploy)
        run: npx prisma migrate deploy
        working-directory: db
      - name: Every public table has RLS on, not forced, no policies (D-40)
        run: npm run check:rls -w @alarmops/db
      - name: Create shadow database
        run: docker exec "${{ job.services.postgres.id }}" createdb -U postgres alarmops_shadow
      - name: Migrations match schema.prisma (prisma migrate diff)
        working-directory: db
        run: |
          set +e
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --script --exit-code > "$RUNNER_TEMP/drift.sql"
          code=$?
          set -e
          echo "prisma migrate diff exit code: $code (0 = no difference, 2 = difference, other = error)"
          cat "$RUNNER_TEMP/drift.sql"
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "::error::prisma migrate diff could not run (exit $code)"
            exit 1
          fi
          node ../.github/scripts/check-migration-drift.mjs "$RUNNER_TEMP/drift.sql" prisma/migrations
      - name: Migration status is clean
        run: npx prisma migrate status
        working-directory: db
      - name: Integration tests against Postgres (when present)
        run: |
          npm run test:db -w @alarmops/db --if-present
          npm run test:sql --workspaces --if-present
        env:
          # store-sql's real-Postgres suite. It creates one schema per test file, so it
          # runs against the service's default database, separate from the migrated one.
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
