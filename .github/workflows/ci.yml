name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

# Runners are pinned to ubuntu-24.04: ubuntu-latest moved to 26.04, which Playwright 1.56 cannot install
# Chromium on. Move all jobs together once the installed @playwright/test supports the newer image.
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (console)
        run: npm run lint -w @alarmops/console
      - name: Unit tests (all workspaces)
        run: npm test
      - name: Build (console)
        run: npm run build -w @alarmops/console

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The run starts its own server with the mock API (playwright.config.ts) and fails if the port is taken.
      PW_NO_REUSE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install Chromium and system packages
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: apps/console
      - name: Install system packages only (browser from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: apps/console
      - name: Build (console)
        run: npm run build -w @alarmops/console
      - name: End-to-end tests (mock mode)
        run: npx playwright test --reporter=list,html
        working-directory: apps/console
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            apps/console/playwright-report/
            apps/console/test-results/
          if-no-files-found: ignore
          retention-days: 7

  db:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alarmops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alarmops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Throwaway database inside this job only. Not a secret.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alarmops
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/alarmops
      # Second database on the same server: `migrate diff` replays the migrations there and wipes it.
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alarmops_shadow
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
        working-directory: db
      - name: Apply migrations (prisma migrate deploy)
        run: npx prisma migrate deploy
        working-directory: db
      - name: Create shadow database
        run: docker exec "${{ job.services.postgres.id }}" createdb -U postgres alarmops_shadow
      - name: Migrations match schema.prisma (prisma migrate diff)
        working-directory: db
        run: |
          set +e
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --script --exit-code > "$RUNNER_TEMP/drift.sql"
          code=$?
          set -e
          echo "prisma migrate diff exit code: $code (0 = no difference, 2 = difference, other = error)"
          cat "$RUNNER_TEMP/drift.sql"
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "::error::prisma migrate diff could not run (exit $code)"
            exit 1
          fi
          node ../.github/scripts/check-migration-drift.mjs "$RUNNER_TEMP/drift.sql" prisma/migrations
      - name: Migration status is clean
        run: npx prisma migrate status
        working-directory: db
      - name: Integration tests against Postgres (when present)
        run: |
          npm run test:db -w @alarmops/db --if-present
          npm run test:sql --workspaces --if-present
