name: deploy-console

# run-name carries the commit this run deploys; the next gate reads it back to find the last deployed commit
# (.github/scripts/deploy_gate.py). Do not change its shape.
run-name: deploy-console ${{ github.event.workflow_run.head_sha || github.sha }}

# Deploys apps/console to Vercel (production) from GitHub Actions (D-53, issue #46). Vercel's own Git auto-deploy must be
# OFF for the project (docs/GO-LIVE.md, step 3), otherwise this gate can be bypassed.
#
# Started two ways: (1) automatically by workflow_run when `ci` succeeded for a push to main in this repository (a merged
# PR), (2) by hand with workflow_dispatch. The merge approval is the human gate; nobody clicks a second approval.
# Gates, in order: trigger (workflow_dispatch, or ci success + push + main + same repository) -> main only -> for
# workflow_run, the merged commit changed a console path (job `gate`) -> `production` environment (branch main only; the
# required reviewer is removed by a person in Settings -> Environments -> production, not by this file) -> the pulled
# production environment passes check-console-deploy-env.mjs -> deploy -> smoke check.
# The OIDC/environment name `production` must not change. A workflow_run deploys exactly ci's head_sha (checkout is pinned
# to it), never a later main. workflow_run runs queue in the `deploy-console` concurrency group.
#
# Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID are `production` ENVIRONMENT secrets (Settings ->
# Environments -> production -> Secrets), not repository secrets: only a job that passed the environment's rules can read
# them. The token is given ONLY to the steps that talk to Vercel (pull, inspect, deploy, promote/rollback), as the VERCEL_TOKEN environment
# variable (never as a command-line argument). Everything that runs third-party or repository code (npm ci, the CLI
# install, vercel build) runs without it, and `vercel build` also runs without any secret from the project's environment:
# right after the env check, strip-deploy-env.mjs cuts the pulled file down to CONSOLE_ORIGIN, TRUSTED_PROXY and
# NEXT_PUBLIC_* (the console builds without the rest: CI runs `next build` with none of them). The runtime gets its real
# variables from the Vercel project. The file is deleted at the end of the job even on failure. Values are never printed.
#
# Vercel CLI: tools/vercel-cli/package.json (exact version) + package-lock.json (integrity hashes), installed with
# `npm ci --ignore-scripts` and run from tools/vercel-cli/node_modules/.bin. Not an app dependency.
# Actions are pinned to full commit SHAs (tag in the comment); .github/dependabot.yml proposes updates.
#
# Vercel project settings assumed: Root Directory `apps/console`, "Include source files outside of the Root Directory"
# on (default), framework Next.js. The CLI is run from the repository root, where `vercel pull` writes `.vercel/`.

on:
  workflow_dispatch:
  # Automatic: after `ci` succeeded for a push to main (a merged PR) in this repository. Never for pull requests or forks.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-console
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"
  VERCEL_TELEMETRY_DISABLED: "1"
  VERCEL_BIN: tools/vercel-cli/node_modules/.bin/vercel

jobs:
  # Decides whether a workflow_run needs a deploy at all: only when the commits since the last successful deploy touched console paths. A manual
  # run always deploys. Fail-safe: no earlier successful deploy, a base that is not an ancestor or a failing git diff means deploy. No secrets, no environment.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    # actions: read lets the gate list this workflow's earlier runs and their jobs (the last successful deploy).
    permissions:
      contents: read
      actions: read
    outputs:
      deploy: ${{ steps.paths.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Decide from the files changed since the last successful deploy
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/deploy_gate.py deploy-console.yml deploy '^(apps/|packages/|tools/vercel-cli/|package[^/]*\.json$|\.github/workflows/deploy-console\.yml$|\.github/scripts/(check-console-deploy-env|strip-deploy-env|smoke-console|rollback-console)\.mjs$)'

  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    # workflow_dispatch can start any branch's copy of this file; only main may deploy.
    needs: gate
    if: github.ref == 'refs/heads/main' && needs.gate.outputs.deploy == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      # package.json engines.node is ">=20" and there is no .nvmrc; CI uses 20, so does this.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      # No token in this step (nor in the one above): installing packages is third-party code.
      - name: Install the pinned Vercel CLI
        run: npm ci --ignore-scripts --prefix tools/vercel-cli
      - name: Check the Vercel settings are present
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set in the production environment"; exit 1; fi
          done
      - name: Pull the production environment from Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: $VERCEL_BIN pull --yes --environment=production
      # The file Vercel gives the build is the one checked (checked values = deployed values). Names and reasons only.
      - name: Check the console deploy environment
        run: node .github/scripts/check-console-deploy-env.mjs .vercel/.env.production.local
      # Only repository scripts run between pull and here. Now remove every secret before the build runs repo code.
      - name: Strip secrets from the pulled environment
        run: node .github/scripts/strip-deploy-env.mjs .vercel/.env.production.local
      - name: Build (prebuilt output, production), without the token
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: $VERCEL_BIN build --prod
      # Automatic rollback (D-59/D-60), part 1: remember which deployment production serves NOW, before the new one goes live.
      - name: Read the production address
        id: origin
        run: node .github/scripts/rollback-console.mjs origin .vercel/.env.production.local >> "$GITHUB_OUTPUT"
      - name: Record the current production deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          ORIGIN: ${{ steps.origin.outputs.origin }}
        # A failing inspect (first deploy, nothing behind the address) is not an error here: it means "no previous deployment".
        run: |
          $VERCEL_BIN inspect "$ORIGIN" > "$RUNNER_TEMP/inspect-before.txt" 2>&1 || echo "vercel inspect failed, treating it as no previous deployment"
      - name: Pick the previous deployment
        id: previous
        run: node .github/scripts/rollback-console.mjs previous "$RUNNER_TEMP/inspect-before.txt" >> "$GITHUB_OUTPUT"
      - name: Deploy the prebuilt output
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # stdout of `vercel deploy` is the deployment URL (not a secret); progress goes to stderr.
          url=$($VERCEL_BIN deploy --prebuilt --prod)
          if ! [[ "$url" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]]; then
            echo "::error::unexpected output from vercel deploy (not a *.vercel.app deployment URL)"; exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployment: $url" >> "$GITHUB_STEP_SUMMARY"
      # Smoke check runs against CONSOLE_ORIGIN (the production address from the checked environment): the per-deployment
      # URL may sit behind Vercel deployment protection, which would answer 401 to everything and hide real problems.
      # If it fails, the new deployment is already live, so the steps below put the previous one back (part 2) and the run
      # still ends RED: a person must know, even when the rollback worked.
      - name: Smoke check
        id: smoke
        run: node .github/scripts/smoke-console.mjs --env-file .vercel/.env.production.local
      # Part 2. `vercel promote` of the previous production deployment, not `vercel rollback`: rollback turns off
      # auto-assignment of production domains, so the NEXT deploy would not go live and its smoke check would pass against
      # the old one. Promote keeps auto-assignment. Hobby can promote; rollback there only reaches the previous production
      # deployment, which is the same target, so rollback is the fallback if promote is refused. The token is given to
      # this step only because it talks to Vercel; the arguments are a deployment URL that came out of a *.vercel.app check.
      - name: Put the previous deployment back (smoke check failed)
        id: rollback
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PREV_URL: ${{ steps.previous.outputs.prev_url }}
          NEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "### Smoke check FAILED after deploy"
            echo "New deployment: $NEW_URL"
          } >> "$GITHUB_STEP_SUMMARY"
          if ! [[ "$PREV_URL" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]]; then
            echo "::error::smoke check failed and there is no previous production deployment to go back to (first deploy?)"
            echo "Not rolled back: no previous deployment was recorded. Person: Vercel dashboard -> Deployments -> a good deployment -> Promote, or fix forward (docs/GO-LIVE.md, 3-6)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if $VERCEL_BIN promote "$PREV_URL" --timeout 3m; then how=promote
          elif $VERCEL_BIN rollback "$PREV_URL" --timeout 3m; then how=rollback
          else
            echo "::error::automatic rollback failed (promote and rollback both refused); production still serves the new deployment"
            echo "Rollback FAILED. Person: Vercel dashboard -> Deployments -> $PREV_URL -> Promote (docs/GO-LIVE.md, 3-6)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "how=$how" >> "$GITHUB_OUTPUT"
          echo "Production was put back to $PREV_URL with vercel $how. Checking it with the same smoke check next." >> "$GITHUB_STEP_SUMMARY"
          if [ "$how" = rollback ]; then echo "After a rollback Vercel stops auto-assigning new deployments: Promote a deployment in the dashboard before the next deploy (docs/GO-LIVE.md, 3-6)." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Smoke check again on the restored deployment
        id: smoke-after
        if: failure() && steps.rollback.outcome == 'success'
        run: node .github/scripts/smoke-console.mjs --env-file .vercel/.env.production.local
      # The run ends red after a rollback on purpose.
      - name: Fail the run after a rollback
        if: failure() && steps.rollback.outcome == 'success'
        run: |
          if [ "${{ steps.smoke-after.outcome }}" = success ]; then
            echo "Previous deployment is live again and passes the smoke check. This run stays red: the new code needs a fix." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::smoke check failed after deploy; rolled back to the previous deployment (restored one passes the smoke check)"
          else
            echo "The restored deployment ALSO fails the smoke check. Person: check Vercel settings and variables (docs/GO-LIVE.md, 3-6)." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::smoke check failed after deploy and also after rollback; production is not healthy"
          fi
          exit 1
      # Always: the pulled file holds production environment values (secrets are already stripped; this is the second layer).
      - name: Delete the pulled environment
        if: always()
        run: rm -rf .vercel
