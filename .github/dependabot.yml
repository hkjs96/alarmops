version: 2
updates:
  # Workflows pin actions to full commit SHAs; Dependabot proposes the next tagged release as a PR (keeps the tag comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The pinned Vercel CLI used by deploy-console.yml.
  - package-ecosystem: npm
    directory: /tools/vercel-cli
    schedule:
      interval: weekly
  # The pinned Markdown renderer used by tools/docs-site/build.mjs (docs → one HTML page).
  - package-ecosystem: npm
    directory: /tools/docs-site
    schedule:
      interval: weekly
