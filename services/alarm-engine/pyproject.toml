[project]
name = "alarmops-alarm-engine"
version = "0.1.0"
description = "AlarmOps alarm engine (Lambda): port of aws-alert-manager alarm rules"
requires-python = ">=3.12"
dependencies = ["boto3>=1.35", "psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "moto[cloudwatch,sts]>=5", "ruff>=0.6", "mypy>=1.11", "boto3-stubs[cloudwatch,sts]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["pg: needs a local Postgres (skipped otherwise)"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
# Ported spec files keep their original Korean comments/strings verbatim (D-05).
extend-exclude = []

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B023", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/alarm_engine/resource_types/*" = ["E402", "I001", "F401", "UP"]
"src/alarm_engine/registry.py" = ["I001", "UP", "E402"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = false
# The ported registry/spec modules are untyped dict-shaped data by design (D-05: no redesign).
[[tool.mypy.overrides]]
module = ["alarm_engine.resource_types.*", "alarm_engine.registry"]
ignore_errors = true
