<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AlarmOps · Scope variants</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
<style>
/* ===== base: copied unchanged from index.html (tokens, primitives, tables, responsive) ===== */
@font-face{font-family:"Pretendard";font-weight:45 920;font-display:swap;
  src:url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2") format("woff2");}
:root{
  --bg:#fbfaf7;--surface:#ffffff;--soft:#faf8f4;--hair:#f4f1ea;--rule:#ded9cf;--deco:#d3cec3;
  --faint:#76736b;--mut:#6b6862;--ink2:#4a4842;--ink:#1b1a17;--inv:#ffffff;
  --accent:#1451d6;--accent-h:#0f3fa8;--accent-t:rgba(20,81,214,.08);
  --red:#b42318;--red-deep:#7a1710;--red-t:#fdf5f4;--orange:#b54708;--orange-t:#fdf6ef;
  --slate:#4a5568;--green:#067647;--green-t:#f1f8f4;--gray:#8a877f;--amber:#93670a;--amber-t:#fcf7e8;
  --grid:#efebe3;--pop:0 18px 44px rgba(27,26,23,.18);
  --mono:"Space Mono","JetBrains Mono","SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  --sans:"Pretendard","Inter",-apple-system,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12110f;--surface:#1a1916;--soft:#201f1b;--hair:#25231f;--rule:#34312b;--deco:#423e37;
  --faint:#9a958a;--mut:#aaa59a;--ink2:#cfcabe;--ink:#eeeae1;--inv:#12110f;
  --accent:#6b9bff;--accent-h:#8db1ff;--accent-t:rgba(107,155,255,.12);
  --red:#f0645a;--red-deep:#ff8a80;--red-t:#2a1614;--orange:#f0954a;--orange-t:#2a1c10;
  --slate:#a3afc2;--green:#4cc38a;--green-t:#12241a;--gray:#8f8b81;--amber:#e0b050;--amber-t:#2a2210;
  --grid:#24221e;--pop:0 18px 44px rgba(0,0,0,.5);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12110f;--surface:#1a1916;--soft:#201f1b;--hair:#25231f;--rule:#34312b;--deco:#423e37;
  --faint:#9a958a;--mut:#aaa59a;--ink2:#cfcabe;--ink:#eeeae1;--inv:#12110f;
  --accent:#6b9bff;--accent-h:#8db1ff;--accent-t:rgba(107,155,255,.12);
  --red:#f0645a;--red-deep:#ff8a80;--red-t:#2a1614;--orange:#f0954a;--orange-t:#2a1c10;
  --slate:#a3afc2;--green:#4cc38a;--green-t:#12241a;--gray:#8f8b81;--amber:#e0b050;--amber-t:#2a2210;
  --grid:#24221e;--pop:0 18px 44px rgba(0,0,0,.5);color-scheme:dark;}

*{box-sizing:border-box;border-radius:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.ov{font:700 11px/1.3 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.mut{color:var(--mut)} .faint{color:var(--faint)} .ink2{color:var(--ink2)}
.sm{font-size:12px} .xs{font-size:11px}
.b{font-weight:600}
.nowrap{white-space:nowrap}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.stack>*+*{margin-top:16px}

/* ---------- mockup chrome (not part of product) ---------- */
.mk-bar{position:sticky;top:0;z-index:50;background:var(--ink);color:var(--inv);display:flex;align-items:center;gap:4px;
  padding:0 16px;overflow-x:auto;scrollbar-width:none;height:36px}
.mk-bar::-webkit-scrollbar{display:none}
.mk-bar .lbl{font:700 10px var(--mono);letter-spacing:.1em;opacity:.6;margin-right:10px;white-space:nowrap}
.mk-bar button{background:none;border:0;color:inherit;opacity:.62;font:500 12px var(--sans);padding:0 10px;height:36px;white-space:nowrap}
.mk-bar button:hover{opacity:1}
.mk-bar button[aria-selected="true"]{opacity:1;box-shadow:inset 0 -2px 0 var(--inv);font-weight:600}
.mk-bar .tt{margin-left:auto;border:1px solid rgba(255,255,255,.3);height:24px;font:700 10px var(--mono);letter-spacing:.08em;opacity:.85}
:root[data-theme="dark"] .mk-bar .tt{border-color:rgba(0,0,0,.3)}

/* ---------- app shell ---------- */
.top{background:var(--surface);border-bottom:1px solid var(--rule);height:52px;display:flex;align-items:center;padding:0 24px;gap:28px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.02em;font-size:15px;white-space:nowrap}
.logo i{width:14px;height:14px;background:var(--ink);display:inline-block;position:relative}
.logo i:after{content:"";position:absolute;right:-4px;top:-4px;width:7px;height:7px;background:var(--red);border-radius:50%;border:2px solid var(--surface)}
.nav{display:flex;height:100%;gap:2px}
.nav a{display:flex;align-items:center;padding:0 12px;color:var(--mut);font-weight:500;height:100%;text-decoration:none;white-space:nowrap}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--ink)}
.nav .cnt{font:700 10px var(--mono);background:var(--red);color:#fff;padding:1px 5px;margin-left:6px}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.sel{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--rule);background:var(--surface);font-size:13px;white-space:nowrap}
.sel .k{color:var(--faint);font:700 10px var(--mono);letter-spacing:.07em;text-transform:uppercase}
.sel .car{color:var(--faint);font-size:9px}
.av{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font:700 11px var(--mono);
  background:var(--hair);color:var(--ink2);border:1px solid var(--rule);flex:none}
.av.on{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.health{display:inline-flex;align-items:center;gap:6px;font:700 10px var(--mono);letter-spacing:.06em;color:var(--green);white-space:nowrap}
.health:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}

.page{max-width:1360px;margin:0 auto;padding:24px 24px 64px}
.ph{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.ph h1{font-size:27px;font-weight:600;letter-spacing:-.025em;margin:0;line-height:1.15}
.ph h1.sub{font-size:22px;letter-spacing:-.02em}
.ph .desc{color:var(--mut);margin-top:4px;font-size:13px}
.crumb{font:400 12px var(--mono);color:var(--faint);margin-bottom:6px}
.crumb a{color:var(--mut)}
.chain{color:var(--deco);margin:0 5px;font-family:var(--mono)}

/* ---------- primitives ---------- */
.btn{height:32px;padding:0 12px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);font-weight:500;font-size:13px;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn.pri{color:#0b1530}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#0b1530}}
.btn.pri:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn.danger{color:var(--red)}
.btn.ghost{border-color:transparent;background:none;color:var(--mut)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn.lg{height:38px;padding:0 18px;font-size:14px}
.btn[disabled]{background:var(--hair);color:var(--faint);border-color:var(--hair);cursor:not-allowed}
.inp{height:32px;border:1px solid var(--rule);background:var(--surface);padding:0 10px;font:inherit;font-size:13px;color:var(--ink);width:100%}
.inp.focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-t)}
.inp.num{font-family:var(--mono);width:90px;text-align:right}
.lab{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.hint{font-size:12px;color:var(--mut);margin-top:5px}

.card{background:var(--surface);border:1px solid var(--rule)}
.card-h{display:flex;align-items:center;gap:10px;padding:0 16px;height:40px;border-bottom:1px solid var(--rule)}
.card-b{padding:16px}
.card.lb-red{border-left:3px solid var(--red)} .card.lb-orange{border-left:3px solid var(--orange)}
.card.lb-amber{border-left:3px solid var(--amber)} .card.lb-accent{border-left:3px solid var(--accent)}
.card.lb-green{border-left:3px solid var(--green)}
.dashed{border:1px dashed var(--deco);background:transparent}

/* shape marks */
.mk{display:inline-block;width:9px;height:9px;flex:none;vertical-align:middle}
.mk.dot{border-radius:50%;background:currentColor}
.mk.tri{width:10px;height:9px;background:currentColor;clip-path:polygon(50% 0,100% 100%,0 100%)}
.mk.dia{width:8px;height:8px;background:currentColor;transform:rotate(45deg)}
.mk.ring{border-radius:50%;border:2px solid currentColor}
.mk.dash{height:2px;width:10px;background:currentColor}
.mk.chk{width:10px;height:6px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg) translate(1px,-1px)}
.mk.x{width:10px;height:10px;position:relative}
.mk.x:before,.mk.x:after{content:"";position:absolute;left:4px;top:-1px;width:2px;height:12px;background:currentColor;transform:rotate(45deg)}
.mk.x:after{transform:rotate(-45deg)}
.mk.q{width:9px;height:9px;border:2px dotted currentColor;border-radius:50%}

.sev{display:inline-flex;align-items:center;gap:6px;font:700 11px var(--mono);letter-spacing:.04em;white-space:nowrap}
.sev.s1{color:var(--red)} .sev.s2{color:var(--orange)} .sev.s3{color:var(--ink2)} .sev.s4,.sev.s5{color:var(--gray)}
.sev.s1.hot{background:var(--red);color:#fff;padding:3px 7px 3px 6px}
:root[data-theme="dark"] .sev.s1.hot{color:#1a0705}
.sev .lb{color:inherit}
.st{display:inline-flex;align-items:center;gap:6px;font:700 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.st.trig{color:var(--red)} .st.esc{color:var(--orange)} .st.ack{color:var(--slate)} .st.res{color:var(--green)} .st.mute{color:var(--gray)}
.st.warn{color:var(--amber)} .st.info{color:var(--accent)}

.src{display:inline-flex;align-items:center;height:18px;padding:0 5px;font:700 10px var(--mono);letter-spacing:.06em;border:1px solid var(--rule);color:var(--mut);background:var(--surface);white-space:nowrap}
.src.tag{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.src.console{color:var(--accent);border-color:var(--accent)}
.src.customer{color:var(--ink2);border-color:var(--deco);background:var(--hair)}
.src.msp{color:var(--ink2)}
.src.code{border-style:dashed;color:var(--faint)}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 7px;font:700 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;background:var(--hair);color:var(--ink2);white-space:nowrap}
.pill.prd{background:var(--ink);color:var(--inv)}
.kbd{font:400 11px var(--mono);border:1px solid var(--rule);padding:0 4px;color:var(--faint)}
code,.code{font:400 12px var(--mono);background:var(--hair);padding:1px 5px;color:var(--ink2)}
pre.code{display:block;padding:12px 14px;margin:0;white-space:pre;overflow-x:auto;line-height:1.6;border:1px solid var(--rule)}

/* chips & tabs */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:28px;display:inline-flex;align-items:center;gap:7px;padding:0 10px;border:1px solid var(--rule);background:var(--surface);font-size:13px;color:var(--ink2);white-space:nowrap}
.chip .n{font:700 11px var(--mono);color:var(--faint)}
.chip.on{border-color:var(--ink);background:var(--soft);color:var(--ink);font-weight:600}
.chip.on .n{color:var(--ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:10px 10px;color:var(--mut);font-weight:500;white-space:nowrap;text-decoration:none;display:flex;align-items:center;gap:7px}
.tabs a.on{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--ink)}
.tabs a .n{font:700 10px var(--mono);color:var(--faint)}
.tabs a .n.hot{background:var(--amber);color:#fff;padding:1px 5px}
.seg{display:inline-flex;border:1px solid var(--rule)}
.seg span{padding:0 10px;height:28px;display:flex;align-items:center;font-size:12px;color:var(--mut)}
.seg span+span{border-left:1px solid var(--rule)}
.seg span.on{background:var(--ink);color:var(--inv);font-weight:600}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border:1px solid var(--rule);margin-bottom:16px}
.tile{padding:14px 16px 12px;border-left:1px solid var(--hair);position:relative}
.tile:first-child{border-left:0}
.tile .v{font:700 30px/1.1 var(--mono);letter-spacing:-.03em;margin-top:6px}
.tile .d{font-size:12px;color:var(--mut);margin-top:3px}
.tile.on{background:var(--red-t);box-shadow:inset 0 -2px 0 var(--red)}
.tile .v.red{color:var(--red)} .tile .v.orange{color:var(--orange)} .tile .v.amber{color:var(--amber)}

/* tables */
.tw{background:var(--surface);border:1px solid var(--rule);overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{font:700 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--faint);text-align:left;padding:0 12px;height:34px;
  border-bottom:1px solid var(--rule);background:var(--soft);white-space:nowrap}
.t td{padding:10px 12px;border-bottom:1px solid var(--grid);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr:hover td{background:var(--soft)}
.t tr.hot td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.t tr.esc td:first-child{box-shadow:inset 3px 0 0 var(--orange)}
.t tr.rev td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
.t tr.dim td{color:var(--faint)}
.t .r{text-align:right}
.t .ttl{font-weight:600;color:var(--ink)}
.t .org{font-size:12px;color:var(--faint);margin-top:2px}
.t .cbc{width:34px}
.cb{width:14px;height:14px;border:1.5px solid var(--deco);display:inline-block;vertical-align:middle;background:var(--surface)}
.cb.on{background:var(--ink);border-color:var(--ink);position:relative}
.cb.on:after{content:"";position:absolute;left:3px;top:0;width:4px;height:8px;border:solid var(--inv);border-width:0 2px 2px 0;transform:rotate(45deg)}

/* layout grids */
.g-main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.g-detail{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.note>.st{height:19px}
.seg.full{display:flex}.seg.full span{flex:1;justify-content:center}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.side{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}
.vnav a{display:block;padding:7px 10px;color:var(--mut);text-decoration:none;font-size:13px;border-left:2px solid transparent}
.vnav a.on{color:var(--ink);font-weight:600;border-left-color:var(--ink);background:var(--surface)}
.vnav .ov{padding:14px 10px 6px}

/* people */
.ord{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font:700 11px var(--mono);border:1px solid var(--rule);background:var(--surface);color:var(--ink2);flex:none}
.ord.first{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.who{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.plist>div{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--grid)}
.plist>div:first-child{border-top:0}
.plist>div>div{min-width:0;overflow-wrap:anywhere}

/* timeline */
.tl{position:relative;padding-left:4px}
.tl .ev{display:grid;grid-template-columns:20px 64px 1fr;gap:10px;padding:7px 0;position:relative;align-items:start}
.tl .ev:before{content:"";position:absolute;left:8.5px;top:24px;bottom:-8px;width:1px;background:var(--rule)}
.tl .ev:last-child:before{display:none}
.tl .ev .m{display:flex;justify-content:center;padding-top:5px}
.tl .ev .tm{font:400 11px var(--mono);color:var(--faint);padding-top:2px}
.tl .ev .tx{font-size:13px}
.tl .ev .tx .s{display:block;color:var(--mut);font-size:12px}

/* misc */
.kv{margin:0;display:grid;grid-template-columns:140px 1fr;gap:8px 16px;font-size:13px}
.kv dt{color:var(--mut)} .kv dd{margin:0}
.banner{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--rule);background:var(--surface);font-size:13px;margin-bottom:16px}
.banner.amber{border-left:3px solid var(--amber);background:var(--amber-t)}
.banner.accent{border-left:3px solid var(--accent);background:var(--accent-t)}
.banner.red{border-left:3px solid var(--red);background:var(--red-t)}
.note{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--soft);border:1px solid var(--rule);font-size:12.5px;color:var(--ink2)}
.prog{height:4px;background:var(--hair);position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.spark{display:block;width:100%;height:56px}
.strike{text-decoration:line-through;color:var(--faint)}
.tog{width:30px;height:16px;border:1.5px solid var(--deco);position:relative;display:inline-block;vertical-align:middle;flex:none;background:var(--surface)}
.tog:after{content:"";position:absolute;top:2px;left:2px;width:9px;height:9px;background:var(--deco)}
.tog.on{background:var(--ink);border-color:var(--ink)}
.tog.on:after{left:15px;background:var(--inv)}
.tog.lock{opacity:.55}
.steps{display:flex;gap:0;border:1px solid var(--rule);background:var(--surface);margin-bottom:20px}
.steps>div{flex:1;padding:12px 16px;border-left:1px solid var(--rule);display:flex;gap:10px;align-items:center;min-width:0}
.steps>div:first-child{border-left:0}
.steps .ord{width:22px;height:22px}
.steps .done .ord{background:var(--green);border-color:var(--green);color:#fff}
.steps .cur{box-shadow:inset 0 -2px 0 var(--ink);background:var(--soft)}
.steps .cur .ord{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.steps .t1{font-weight:600;font-size:13px;white-space:nowrap}
.steps .t2{font-size:11px;color:var(--faint);font-family:var(--mono)}
.role{display:grid;grid-template-columns:30px 1fr auto;gap:12px;padding:14px 16px;border-top:1px solid var(--grid);align-items:start}
.role:first-child{border-top:0}
.stage{display:flex;align-items:center;gap:0;margin:6px 0 2px}
.stage>span{flex:1;display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--faint);position:relative}
.stage>span b{height:3px;background:var(--rule);display:block}
.stage>span.done b{background:var(--ink)} .stage>span.done{color:var(--ink2)}
.stage>span.cur b{background:var(--orange)} .stage>span.cur{color:var(--orange);font-weight:600}
.drawer{background:var(--surface);border:1px solid var(--rule);box-shadow:var(--pop)}

/* schedule grid */
.wk{display:grid;grid-template-columns:56px repeat(24,1fr);font-size:11px;position:relative}
.wk .hd{font:400 10px var(--mono);color:var(--faint);padding:0 0 6px 2px;border-left:1px solid var(--grid)}
.wk .dl{font:700 11px var(--mono);color:var(--mut);display:flex;align-items:center;height:38px;border-top:1px solid var(--grid)}
.wk .cell{height:38px;border-top:1px solid var(--grid);border-left:1px solid var(--grid)}
.wk .bar{height:26px;margin-top:6px;align-self:start;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:12px;font-weight:600;overflow:hidden;white-space:nowrap;z-index:1}
.wk .bar.a{background:var(--ink);color:var(--inv)}
.wk .bar.b{background:var(--hair);color:var(--ink);border:1px solid var(--deco)}
.wk .bar.c{background:var(--soft);color:var(--ink2);border:1px dashed var(--deco)}
.wk .bar.ovr{background:repeating-linear-gradient(135deg,var(--accent-t) 0 6px,transparent 6px 12px),var(--surface);border:1px solid var(--accent);color:var(--accent)}
.wk .now{position:absolute;top:18px;bottom:0;width:2px;background:var(--red);z-index:2}
.wk .now:before{content:"NOW 03:16";position:absolute;top:-16px;left:4px;white-space:nowrap;font:700 9px var(--mono);color:var(--red)}

/* escalation ladder */
.lad{display:grid;grid-template-columns:44px 110px 1fr 1.3fr 140px 30px;gap:0;align-items:center}
.lad>div{padding:12px;border-top:1px solid var(--grid);min-height:58px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.ch{height:24px;padding:0 8px;display:inline-flex;align-items:center;gap:5px;font-size:12px;border:1px solid var(--rule);color:var(--faint);background:var(--surface)}
.ch.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.axis{position:relative;height:74px;margin:6px 8px 0}
.axis .ln{position:absolute;left:0;right:0;top:30px;height:1px;background:var(--rule)}
.axis .pt{position:absolute;top:16px;transform:translateX(-50%);text-align:center;font-size:11px;white-space:nowrap}
.axis .pt i{display:block;width:12px;height:12px;margin:8px auto 6px;background:var(--surface);border:2px solid var(--ink)}
.axis .pt.rep i{border-color:var(--accent);border-style:dashed}
.axis .pt.end i{background:var(--ink)}
.axis .pt b{font:700 10px var(--mono);color:var(--faint);position:absolute;top:-16px;left:50%;transform:translateX(-50%)}

/* portal */
.portal-top{background:var(--surface);border-bottom:1px solid var(--rule);height:56px;display:flex;align-items:center;padding:0 24px;gap:16px}
.portal{max-width:960px;margin:0 auto;padding:32px 24px 64px}
.hero-status{padding:24px;display:flex;gap:18px;align-items:flex-start}
.hero-status .big{width:44px;height:44px;border:2px solid var(--orange);display:flex;align-items:center;justify-content:center;color:var(--orange);flex:none}
.big-q{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.3}


/* on-call (D-30, D-31) */
.oc-chain{display:flex;align-items:center;gap:12px;padding:16px;flex-wrap:wrap}
.oc-p{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--rule);background:var(--surface);min-width:0;flex:1}
.oc-p.first{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.oc-arr{color:var(--faint);font:700 14px var(--mono)}
.oc-wk{font:700 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:10px 16px 6px;background:var(--soft);border-top:1px solid var(--grid)}
.oc-days>div{display:flex;align-items:center;gap:12px;padding:9px 16px;border-top:1px solid var(--grid);min-height:44px}
.oc-days .d{font:700 12px var(--mono);width:56px;color:var(--ink2);flex:none}
.oc-days .nm{flex:1;min-width:0}
.oc-days .now{box-shadow:inset 3px 0 0 var(--ink);background:var(--soft)}
.oc-days .pend{background:var(--accent-t);box-shadow:inset 3px 0 0 var(--accent)}
.oc-strip{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--grid)}
.oc-strip span{text-align:center;padding:8px 0;font:700 12px var(--mono);border-left:1px solid var(--grid);color:var(--ink2)}
.oc-strip span:first-child{border-left:0}
.oc-strip span i{display:block;font:400 10px var(--mono);color:var(--faint);font-style:normal}
.oc-strip span.me{background:var(--soft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.oc-presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.oc-presets>div{border:1px solid var(--rule);padding:10px 12px;background:var(--surface);cursor:pointer;min-height:44px}
.oc-presets>div b{display:block}
.oc-presets>div span{font-size:12px;color:var(--mut)}
.oc-presets>div.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--soft)}
.oc-presets>div.add{border-style:dashed}
.oc-presets.ob-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.oc-presets.ob-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ed-r select{min-width:0}
select.inp{max-width:100%}
#s-customer-resp .g-main{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
@media (max-width:1100px){#s-customer-resp .g-main{grid-template-columns:minmax(0,1fr)}}
.oc-sent{font-size:15px;line-height:1.55;padding:12px 14px;border-left:3px solid var(--ink);background:var(--soft)}
#oc-form{scroll-margin-top:48px}
.oc-ord{padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.oc-li{display:flex;align-items:center;gap:10px;padding:6px 14px;border:1px solid var(--grid);font-size:13px;flex-wrap:wrap}
.oc-more summary{cursor:pointer;font-size:13px;color:var(--ink2);padding:6px 14px}
.oc-more .oc-li{margin-top:6px}
.oc-drag{list-style:none;counter-reset:o;padding:0;margin:8px 0}
.oc-drag li{counter-increment:o;padding:8px 12px;border:1px solid var(--rule);margin-bottom:4px;background:var(--surface);cursor:grab;min-height:40px}
.oc-drag li:before{content:"⋮⋮ " counter(o) ". ";color:var(--faint);font-family:var(--mono)}
@media (max-width:760px){.oc-strip{grid-template-columns:repeat(4,1fr)}.oc-strip span:nth-child(5){border-left:0}.oc-strip span:nth-child(n+5){border-top:1px solid var(--grid)}}
.oc-tl{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--rule);margin-top:6px}
.oc-tl span{padding:6px 8px;border-left:1px solid var(--grid);color:var(--ink2)}
.oc-tl span:first-child{border-left:0}
.oc-tl span.stop{background:var(--soft);color:var(--ink);font-weight:700}
.oc-cs{font-size:13px;line-height:1.5;margin-top:6px;padding:6px 10px;border-left:3px solid var(--rule);background:var(--soft)}
.oc-cust>div{align-items:flex-start}
.oc-then{display:block;line-height:1.5}.oc-then+.oc-then{margin-top:2px}
.t.ccards td>div{min-width:0}

.oc-paged{display:inline-flex;align-items:center;gap:6px;font-size:13px;margin-top:8px}
.top .nav,.top .logo,.top-r{flex:none}
.oc-adv summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--ink2);padding:6px 0}
.oc-pending{flex-wrap:wrap}
@media (max-width:760px){
  .oc-chain{flex-direction:column;align-items:stretch;gap:6px}
  .oc-arr{transform:rotate(90deg);align-self:center;line-height:1}
  .oc-presets{grid-template-columns:minmax(0,1fr)}
  .oc-pending{flex-direction:column;align-items:flex-start;gap:8px}
  .oc-cta{width:100%;justify-content:center;min-height:44px}
  .oc-adv .lad>div{min-height:0;padding:8px}
}

.screen{display:none}
.screen.on{display:block}

/* contacts & people (D-29) */
.cv{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;font-size:12px;border:1px solid var(--rule);background:var(--surface);white-space:nowrap}
.cv.ok{color:var(--green)} .cv.exp{color:var(--orange);border-color:var(--orange)} .cv.unv{color:var(--slate);border-color:var(--slate)}
.cv.sent{color:var(--accent);border-color:var(--accent)} .cv.none{color:var(--gray);border-style:dashed}
.ct-q{width:220px}
.ct-grp{margin-bottom:12px}
.ct-grp>summary{cursor:pointer;list-style:none}
.ct-grp>summary::-webkit-details-marker{display:none}
.ct-grp>summary .car,.tn .car{color:var(--faint);font-size:9px;width:10px;display:inline-block}
.ct-grp:not([open])>summary{border-bottom:0}
.ct-grp:not([open])>summary .car{transform:rotate(-90deg)}
.ct-row,.pp-row{display:grid;grid-template-columns:minmax(180px,1fr) 90px minmax(0,2fr) 210px;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--grid)}
.ct-list .ct-row:first-child{border-top:0}
.ct-tm,.ct-ch,.ct-a,.pp-rl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ct-a{justify-content:flex-end}
.ct-hid{padding:8px 16px;border-top:1px solid var(--grid);display:none}
.ct-hid a{cursor:pointer}
.f-act .ct-row[data-ok]{display:none}
.f-act .ct-hid{display:block}
.ct-row.q-miss{display:none !important}
.tc{font:700 10px var(--mono);color:var(--faint);border:1px solid var(--rule);padding:0 4px;min-width:16px;text-align:center}
.tc.warn{color:#fff;background:var(--amber);border-color:var(--amber)}
.pp{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
.tr,.tr ul{list-style:none;margin:0;padding:0}
.tr ul{padding-left:16px}
.tn{display:flex;align-items:center;gap:6px;padding:7px 12px;font-size:13px;color:var(--ink2);text-decoration:none;cursor:pointer;min-height:36px;border-left:2px solid transparent}
.tn:hover{background:var(--soft)}
.tn.on{background:var(--accent-t);border-left-color:var(--accent);color:var(--ink);font-weight:600}
.pp-row{grid-template-columns:minmax(160px,1.1fr) minmax(170px,1.3fr) minmax(120px,.9fr) minmax(0,1.2fr) 130px}
.pp-row.inh{background:var(--soft)}
.pp-sc{display:flex;flex-direction:column;min-width:0}
.pp-sec{font:700 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:10px 16px 4px;border-top:1px solid var(--grid)}
.oc-cn{margin-top:10px;padding:8px 12px;border:1px dashed var(--deco);display:flex;flex-direction:column;gap:3px}
.oc-cn .ov{margin-right:8px}
@media (max-width:1100px){.pp{grid-template-columns:minmax(0,1fr)}.pp-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.pp-row .ct-a{justify-content:flex-start}}
@media (max-width:760px){
  .ct-row,.pp-row{grid-template-columns:minmax(0,1fr) auto;gap:8px}
  .ct-row .ct-ch,.pp-row .ct-ch,.pp-row .pp-sc{grid-column:1 / -1}
  .ct-row .ct-a{grid-column:1 / -1;justify-content:flex-start}
  .ct-row .ct-tm{justify-content:flex-end}
  .pp-row .ct-a{grid-column:1 / -1}
  .ct-q{width:100%;order:3}
  .ct-xc{flex-direction:column;align-items:flex-start}
  .pp .seg.full{flex-direction:column}.pp .seg.full span+span{border-left:0;border-top:1px solid var(--rule)}
}

/* D-30 + scale additions */
.oc-paged{flex-wrap:wrap;max-width:100%}
.pill.cz{background:var(--accent-t);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pill.hp.ar{background:var(--amber-t);color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.lvl{display:inline-flex;align-items:center;gap:5px;font:700 11px var(--mono);letter-spacing:.04em;white-space:nowrap}.lvl.unr{color:var(--red)}.lvl.ar{color:var(--amber)}
.t tr.amb td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
.pill.hp{background:var(--red-t);color:var(--red);box-shadow:inset 0 0 0 1px var(--red);white-space:normal;height:auto;min-height:20px}
.pill.cu{background:var(--soft);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--deco)}
.pl-bulk{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--rule);background:var(--soft);flex-wrap:wrap}
.pl-row{display:grid;grid-template-columns:24px minmax(170px,1fr) minmax(0,1.4fr) minmax(0,1.6fr) auto;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--grid)}
.pl-row.inh{background:var(--soft)}
.pl-cb input{width:16px;height:16px;margin:0}
.pl-ctx{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}
.oc-li.oc-first{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink);padding:10px 14px}
.oc-li.oc-first .b{font-size:16px}
.ed-h,.ed-r{display:grid;grid-template-columns:36px 100px minmax(0,1fr) minmax(0,1.3fr) 24px;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--grid)}
.ed{border:1px solid var(--rule)}
.ed-h{font:700 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--faint);background:var(--soft);border-top:0}
.ch.js-how{cursor:pointer}
.t tr.cur td:first-child{box-shadow:inset 3px 0 0 var(--ink)}
.js-tl{cursor:pointer}
@media (max-width:1100px){.pl-row{grid-template-columns:24px minmax(0,1fr) minmax(0,1fr)}.pl-row .ct-ch,.pl-row .ct-a{grid-column:2 / -1}}

}

/* ===== scope-variants additions (prefix v-) ===== */
:root{--mkh:64px}
.mk-wrap{position:sticky;top:0;z-index:60}
.mk-bar{position:static}
.mk-bar .sepv{width:1px;height:16px;background:currentColor;opacity:.25;margin:0 8px;flex:none}

.mk-bar .tt{margin-left:0;padding:0 8px}
.mk-bar .sp{flex:1;min-width:8px}
.mk-url{background:var(--hair);border-bottom:1px solid var(--rule);height:28px;display:flex;align-items:center;gap:10px;padding:0 16px;
  font:400 11px var(--mono);color:var(--ink2);white-space:nowrap;overflow:hidden}

.v-ch{white-space:normal}
.v-ch .chain{margin:0 4px}
.tiles.t4{grid-template-columns:repeat(4,1fr)}
.v-ap .chain,.v-sh .chain,.ph .desc .chain,.v-scope-big .chain{color:var(--mut)}

/* A: global scope bar */
.v-sb{position:sticky;top:var(--mkh);z-index:40;background:var(--surface);border-bottom:1px solid var(--rule);box-shadow:inset 0 -2px 0 var(--ink);
  display:flex;align-items:center;gap:8px;padding:0 24px;height:46px}

function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function CUS(){return S.n==='34'?D.customers.concat(EXTRA):D.customers;}
function C(id){return D.customers.concat(EXTRA).filter(function(c){return c.id===id;})[0];}
function isP(id){return String(id).indexOf('p:')===0;}
function per(id){return isP(id)?D.people.filter(function(p){return p.id===id;})[0]:D.staff[id];}
function readHash(){var q=new URLSearchParams(location.hash.slice(1));Object.keys(DEF).forEach(function(k){S[k]=q.get(k)||DEF[k];});
  if(!VAR[S.v])S.v='A';if(!SCREENS.some(function(x){return x[0]===S.s;}))S.s='incidents';
  if(S.c&&!C(S.c)){S.c='';}if(!S.c){S.p='';S.svc='';}
  if(S.c&&S.p&&!pn(S.c,S.p))S.p='';if(!S.p)S.svc='';}
function hashOf(st){var q=new URLSearchParams();Object.keys(DEF).forEach(function(k){if(st[k]&&st[k]!==DEF[k])q.set(k,st[k]);});return '#'+q.toString();}
function go(patch){var st={};Object.keys(S).forEach(function(k){st[k]=S[k];});Object.keys(patch).forEach(function(k){st[k]=patch[k];});
  var h=hashOf(st);if(h===(location.hash||'#')){render();}else{location.hash=h;}}

/* ===== scope helpers. A scope is {c, p, s}; null = all customers. key = "c|p|s" ===== */
function sc(){return S.c?{c:S.c,p:S.p||null,s:S.svc||null}:null;}
function key(x){return x?[x.c,x.p||'',x.s||''].join('|'):'';}
function parseKey(k){if(!k)return null;var a=k.split('|');return {c:a[0],p:a[1]||null,s:a[2]||null};}
function pn(c,p){return C(c).tree.filter(function(x){return x.n===p;})[0];}
function sn(c,p,s){var P=pn(c,p);return P&&P.s.filter(function(x){return x.n===s;})[0];}
function lbl(x){return x?[C(x.c).n,x.p,x.s].filter(Boolean).join(' › '):'All customers';}
function pl(n,w){return n+' '+w+(n===1?'':'s');}
function lvl(x){return !x?'all':x.s?'service':x.p?'project':'customer';}
function svcs(x){var c=C(x.c);if(x.s)return [x.s];var ps=x.p?[pn(x.c,x.p)]:c.tree;var o=[];ps.forEach(function(p){p.s.forEach(function(s){o.push(s.n);});});return o;}
function extent(x){ // human size of a scope
  if(x.s)return '1 service';var n=svcs(x).length;
  if(x.p)return n+' service'+(n>1?'s':'')+': '+svcs(x).join(', ');
  var c=C(x.c);return c.tree.length+' project'+(c.tree.length>1?'s':'')+', '+n+' service'+(n>1?'s':'');}
function match(it,x){return !x||(it.c===x.c&&(!x.p||it.p===x.p)&&(!x.s||it.s===x.s));}
function overlap(w,x){return !x||(w.c===x.c&&(!x.p||!w.p||w.p===x.p)&&(!x.s||!w.s||w.s===x.s));}
function staffOf(c){var t=c.template?D.templates[c.template].members:[];var o=t.slice();c.staff.forEach(function(s){if(o.indexOf(s)<0)o.push(s);});return o;}
function covers(u,c){return staffOf(c).indexOf(u)>=0;}
function mine(){return CUS().filter(function(c){return covers(S.u,c);});}
function vis(cid){return !S.m||!cid||covers(S.u,C(cid));}
function pageable(c){return D.people.filter(function(p){return p.c===c.id&&p.roles.indexOf('pageable')>=0;});}
function respN(c){return staffOf(c).length+pageable(c).length;}
// link chain: each level is clickable and narrows the scope (what "narrow" does depends on the variant shell)
function chain(x,opt){opt=opt||{};if(!x||!x.c)return '<span class="mut">—</span>';var c=C(x.c),o=[];
  if(!opt.noCust)o.push('<a data-sc="'+esc(key({c:x.c}))+'">'+esc(c.n)+'</a>');
  if(x.p)o.push('<a data-sc="'+esc(key({c:x.c,p:x.p}))+'">'+esc(x.p)+'</a>');
  if(x.s)o.push('<a data-sc="'+esc(key(x))+'">'+esc(x.s)+'</a>');
  if(!o.length)return '<span class="mut">All projects</span>';
  return '<span class="v-ch">'+o.join('<span class="chain">›</span>')+'</span>';}
function plain(x){return esc(lbl(x)).replace(/ › /g,'<span class="chain">›</span>');}

/* ===== paging resolution (D-30): service › project › customer, first level with its own steps wins ===== */
function baseSteps(c){if(c.steps)return c.steps;var first=c.style==='all'?{type:'ALL'}:{type:'ROTATION',id:c.style==='rotation'?c.rot:c.shared};
  return D.plans.standard.steps.map(function(s){return {at:s.at,to:s.t==='ALL'?{type:'ALL'}:first,how:s.how};});}
function resolve(x){var c=C(x.c),P=x.p&&pn(x.c,x.p),Sv=x.s&&sn(x.c,x.p,x.s);
  if(Sv&&Sv.ov)return {steps:Sv.ov.steps,rep:Sv.ov.repeat,from:{c:x.c,p:x.p,s:x.s},own:true,ov:Sv.ov};
  if(P&&P.ov)return {steps:P.ov.steps,rep:P.ov.repeat,from:{c:x.c,p:x.p},own:!x.s,ov:P.ov};
  return {steps:baseSteps(c),rep:c.repeat,from:{c:x.c},own:!x.p};}
function overrides(c){var o=[];c.tree.forEach(function(p){if(p.ov)o.push({c:c.id,p:p.n});p.s.forEach(function(s){if(s.ov)o.push({c:c.id,p:p.n,s:s.n});});});return o;}
function howT(h){return h.join(' + ').replace('Call','call').replace(/^./,function(a){return a.toUpperCase();});}
function tgt(c,to){if(to.type==='ALL')return 'everyone in Responders ('+respN(c)+')';
  if(to.type==='ROTATION'){var r=D.rotations[to.id];return 'on shift in '+r.n+' (<b>'+r.on+'</b> now)';}
  var p=per(to.id);return '<b>'+esc(p.n)+'</b>'+(isP(to.id)?' ('+esc(C(p.c).n)+')':'');}
function sentence(c,r){return r.steps.map(function(s){return howT(s.how)+' '+tgt(c,s.to)+' '+(s.at?'at <b>'+s.at+' min</b>':'now');}).join(' → ')+' → '+(r.rep?'repeat once':'no repeat')+'.';}

  if(!rows.length)h+='<tr><td colspan="7" class="mut" style="padding:28px 16px">No open incidents in '+esc(lbl(x))+'. <a data-sc="" style="color:var(--accent)">Show all customers</a></td></tr>';

  if(S.m)q.push('mine=1');if(S.v==='D'&&S.o)q.push('open='+S.o.replace(/\|+$/,'').replace(/\|/g,'/').replace(/ /g,'-').toLowerCase());
  return 'console.alarmops.example'+path+(q.length?'?'+q.join('&'):'');}
function renderMk(){var u=D.staff[S.u];
  $('#mk').innerHTML='<span class="lbl">SCOPE VARIANTS</span>'+Object.keys(VAR).map(function(k){return '<button class="vb" aria-selected="'+(S.v===k)+'" data-v="'+k+'">'+k+' · '+VAR[k]+'</button>';}).join('')+
    '<span class="sepv"></span>'+SCREENS.map(function(x){return '<button aria-selected="'+(S.s===x[0])+'" data-s="'+x[0]+'">'+x[1]+'</button>';}).join('')+'<span class="sp"></span>'+
    '<button class="tt" data-act="n">'+(S.n==='34'?'34':'14')+' CUSTOMERS</button><button class="tt" data-act="u">AS '+u.n.split(' ')[0].toUpperCase()+'</button><button class="tt" data-act="theme">THEME</button>';
  $('#mk-url').textContent=productUrl();}
function renderOv(){$('#ov').innerHTML=panel()+popHtml()+swHtml();}
function render(){readHash();document.title='AlarmOps · Scope variant '+S.v+' · '+S.s;renderMk();$('#app').innerHTML=shell();renderOv();}
function closest(el,sel){while(el&&el.nodeType===1){if(el.matches(sel))return el;el=el.parentNode;}return null;}
document.addEventListener('click',function(e){var t=e.target,el;
  if((el=closest(t,'[data-pink]'))){var k=el.getAttribute('data-pink'),i=PIN.indexOf(k);if(i>=0)PIN.splice(i,1);else PIN.push(k);$('#swl').innerHTML=swList();e.stopPropagation();return;}
  if((el=closest(t,'[data-swi]'))){pick(SW.list[+el.getAttribute('data-swi')],S.v==='D'&&/new/.test(S.o));return;}
  if((el=closest(t,'[data-act]'))){var a=el.getAttribute('data-act');
    if(a==='sw'){POP=null;swOpen();}else if(a==='swclose')swClose();else if(a==='popclose'){POP=null;renderOv();}
    else if(a==='closep')go({o:''});else if(a==='mine')go({m:S.m?'':'1'});
    else if(a==='n')go({n:S.n==='34'?'14':'34'});else if(a==='u')go({u:S.u==='jp'?'hk':'jp'});
    else if(a==='theme'){var r=document.documentElement,d=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.setAttribute('data-theme',d==='dark'?'light':'dark');}
    else if(a==='pin'){PIN.push(key(sc()));render();}
    else if(a==='copy'){var url=location.href;try{navigator.clipboard.writeText(url);}catch(_){ }toast('Link copied. Opens variant '+S.v+' on '+S.s+' with scope <b>'+esc(lbl(sc()))+'</b>'+(S.o?' and the same panel open':'')+'.');}
    else if(a==='save')toast(el.getAttribute('data-msg'));
    else if(a==='ack')toast('Acknowledged · paging stopped for this incident');
    else if(a==='staffdir'){var s=$('#staffdir');s.style.display=s.style.display==='none'?'block':'none';}
    e.stopPropagation();return;}
  if((el=closest(t,'[data-pop]'))){var r=el.getBoundingClientRect();POP={kind:el.getAttribute('data-pop'),x:Math.max(8,Math.min(r.left,innerWidth-260)),y:r.bottom+4};renderOv();return;}
  if((el=closest(t,'[data-inc]'))){SW.open=false;go({c:'',p:'',svc:'',s:'incidents',o:''});return;}
  if((el=closest(t,'[data-sc]'))){POP=null;pick(el.getAttribute('data-sc'),el.hasAttribute('data-keep'));e.preventDefault();return;}
  if((el=closest(t,'[data-open]'))){go({o:el.getAttribute('data-open')});return;}
  if((el=closest(t,'[data-v]'))){go({v:el.getAttribute('data-v'),o:''});return;}
  if((el=closest(t,'[data-s]'))){go({s:el.getAttribute('data-s'),o:''});scrollTo(0,0);return;}
});
document.addEventListener('input',function(e){
  if(e.target.id==='swq'){SW.q=e.target.value;SW.i=0;$('#swl').innerHTML=swList();}
  if(e.target.id==='gq'){var q=e.target.value.trim().toLowerCase();$$('.v-gc').forEach(function(b){b.classList.toggle('hide',!!q&&b.getAttribute('data-q').indexOf(q)<0);});$$('.v-gate details').forEach(function(d){if(q)d.open=true;});}
});
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();SW.open?swClose():swOpen();return;}
  if(e.key==='Escape'){if(SW.open)swClose();else if(POP){POP=null;renderOv();}else if(S.o)go({o:''});return;}
  if(e.target.id==='gq'&&e.key==='Enter'){var f=$$('.v-gc').filter(function(b){return !b.classList.contains('hide');})[0];if(f)pick(f.getAttribute('data-sc'));return;}
  if(!SW.open)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();SW.i=Math.max(0,Math.min(SW.list.length-1,SW.i+(e.key==='ArrowDown'?1:-1)));$('#swl').innerHTML=swList();var c=$('.v-sw-i.cur');if(c)c.scrollIntoView({block:'nearest'});}
  if(e.key==='Enter'&&SW.list.length){pick(SW.list[SW.i],S.v==='D'&&/new/.test(S.o));}
});
window.addEventListener('hashchange',render);
render();

</script>
